<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>Fleet Dash · Offline</title>
<style>
  :root{color-scheme:dark;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:#0a0e14;color:#e6edf3;padding:24px}
  main{width:min(100%,440px);border:1px solid #30363d;border-radius:16px;background:#0d1117;padding:24px}
  i{display:block;width:12px;height:12px;border-radius:50%;background:#d29922;box-shadow:0 0 0 5px rgba(210,153,34,.12);margin-bottom:18px}
  h1{font-size:20px;margin:0 0 6px}p{color:#8b949e;margin:0}button{margin-top:20px;border:1px solid #30363d;border-radius:9px;background:#161b22;color:#e6edf3;padding:9px 13px;font:inherit;cursor:pointer}
</style>
</head>
<body><main><i></i><h1>Reconnect to your tailnet</h1><p>Fleet keeps private session data network-only. Reconnect, then try again.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
