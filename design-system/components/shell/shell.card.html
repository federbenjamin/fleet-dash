    <div style={{display:'flex',gap:16,height:388}}>
      <div style={{border:'1px solid var(--line)',borderRadius:10,overflow:'hidden',display:'flex'}}>
        <NavRail active="NOW"

      <div style={{flex:1,display:'flex',flexDirection:'column',gap:8}}>
        <NotificationRow title="design-probe asked a question" meta="2m" tone="amber" unread open={open===0} onTap={()=>setOpen(0)} />
