<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;display:flex;align-items:center;gap:14px;box-sizing:border-box}body{flex-direction:column;align-items:stretch;gap:8px;justify-content:center}</style></head><body>

<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font:400 12px var(--font-mono);color:var(--fg-dim-2)">dim-2 — peek text, agent descriptions</span><span style="font:var(--text-micro);color:var(--fg-dim-3)">#8F8878</span></div>
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font:400 12px var(--font-mono);color:var(--fg-dim-3)">dim-3 — quiet time, section labels, rail items</span><span style="font:var(--text-micro);color:var(--fg-dim-3)">#7E7666</span></div></body></html>
