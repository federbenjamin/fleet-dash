<!-- @dsCard group="Colors" viewport="700x130" subtitle="Page, card, raised, input surfaces + the three hairlines" name="Surfaces & hairlines" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;display:flex;align-items:center;gap:14px;box-sizing:border-box}</style></head><body>
<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="width:92px;height:52px;border-radius:7px;background:var(--bg);border:1px solid var(--line)"></div><div style="font:var(--text-micro);color:var(--fg-dim-1)">bg · #0E0D0B</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="width:92px;height:52px;border-radius:7px;background:var(--surface-card);border:1px solid var(--line)"></div><div style="font:var(--text-micro);color:var(--fg-dim-1)">card · #14120E</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="width:92px;height:52px;border-radius:7px;background:var(--surface-raised);border:1px solid var(--line)"></div><div style="font:var(--text-micro);color:var(--fg-dim-1)">raised · #1A1712</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="width:92px;height:52px;border-radius:7px;background:var(--surface-input);border:1px solid var(--line)"></div><div style="font:var(--text-micro);color:var(--fg-dim-1)">input · #12100D</div></div>
<div style="display:flex;flex-direction:column;gap:10px;margin-left:12px;flex:1">
<div style="border-top:1px solid var(--line);padding-top:3px;font:var(--text-micro);color:var(--fg-dim-3)">--line #262219 · default</div>
<div style="border-top:1px solid var(--line-soft);padding-top:3px;font:var(--text-micro);color:var(--fg-dim-3)">--line-soft #2A261F · bubbles</div>
<div style="border-top:1px solid var(--line-input);padding-top:3px;font:var(--text-micro);color:var(--fg-dim-3)">--line-input #3A311E · inputs, icon buttons</div>
</div></body></html>
