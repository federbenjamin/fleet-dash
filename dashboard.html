<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- maximum-scale=1 only disables iOS's AUTO-zoom on input focus; pinch zoom
     still works (iOS ignores it for user gestures since iOS 10) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Fleet View</title>
<style>
:root{
  --bg:#0d1117; --card:#161b22; --card2:#1c2330; --line:#2d333b;
  --fg:#e6edf3; --dim:#8b949e; --faint:#57606a;
  --green:#3fb950; --amber:#d29922; --red:#f85149; --blue:#58a6ff; --purple:#bc8cff;
}
*{box-sizing:border-box;margin:0;padding:0}
/* scrollbars hide when idle (vertical + horizontal): transparent by default,
   thumb appears only while the element carries .scrolling (JS scroll listener).
   Standard properties only — in Chrome, setting scrollbar-color disables
   ::-webkit-scrollbar styling, so never mix the two. */
*{scrollbar-width:thin;scrollbar-color:transparent transparent}
.scrolling{scrollbar-color:#4a545f transparent}
body{background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Mono",Menlo,sans-serif;
     padding:12px 12px calc(24px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.pagetitle{font-size:22px;font-weight:700;padding:4px 2px 2px;display:flex;align-items:center}
.pagetitle span{flex:1}
#gear{background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer;padding:2px 6px}
.setpanel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.setrow{display:block;font-size:13px;color:var(--fg);padding:5px 0;cursor:pointer}
.setrow input[type=checkbox]{margin-right:8px;accent-color:var(--blue)}
.setnum{color:var(--dim)}
.setnum input{width:72px;background:var(--card2);border:1px solid var(--line);border-radius:6px;
              color:var(--fg);padding:3px 6px;font:inherit;font-size:13px;margin:0 4px}
.bell{background:none;border:none;font:inherit;font-size:14px;cursor:pointer;padding:0 2px;opacity:.9}
.bell.muted{opacity:.4}
header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:2px 2px 12px}
#totals{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
#totals b{color:var(--fg);font-variant-numeric:tabular-nums}
#totals .sep{color:var(--faint);font-style:normal;margin:0 7px}
/* one-line "last message" preview — the newest prose, never a tool call */
.lastmsg{display:flex;align-items:baseline;gap:7px;padding:6px 12px;font-size:12px;
  color:var(--dim);border-top:1px solid var(--line);background:#0f1319;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lastmsg .lmwho{flex:0 0 auto;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;
  color:var(--faint)}
.lastmsg .lmtext{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lastmsg .lmwho.user{color:var(--blue)}
.lastmsg.amsgprev{background:none;border-top:none;padding-top:0;padding-bottom:7px;
  font-size:11.5px;cursor:pointer}
#stale{display:none;background:var(--red);color:#fff;border-radius:6px;padding:6px 10px;font-size:12px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:clip}
.card.needs{border-color:var(--amber)}
.card.stalled{border-color:var(--red)}
/* sticky: header pins to the viewport top while its card scrolls past (so a long
   open card can still be collapsed), then exits with the card bottom. Requires the
   card ancestor NOT be a scroll container: overflow:clip above, never hidden. */
.shead{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;user-select:none;
       position:sticky;top:0;z-index:5;background:var(--card)}
.chip{font-size:11px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap}
.chip.running{background:#12261e;color:var(--green)}
.chip.needs_you{background:#2b2111;color:var(--amber)}
.chip.turn_done{background:#12261e;color:var(--green);border:1px solid var(--green)}
.chip.idle{background:var(--card2);color:var(--dim)}
.chip.stalled{background:#2d1214;color:var(--red)}
.chip.stalled_or_prompt{background:#2b2111;color:var(--amber)}
.chip.dormant{background:var(--card2);color:var(--faint)}
.card.dorm{opacity:.5}
.sname{font-weight:600;overflow:hidden;flex:1;min-width:0;line-height:1.3}
.sname .stitle,.sname small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sname small{color:var(--dim);font-weight:400}
.scost{font-variant-numeric:tabular-nums;color:var(--fg);font-weight:600;white-space:nowrap}
.smeta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:0 12px 10px;font-size:12px;color:var(--dim)}
.smeta .m{white-space:nowrap}
.ctxwrap{flex:0 0 auto;display:flex;align-items:center;gap:5px}
.ctxbar{width:80px;height:5px;background:var(--card2);border-radius:3px;overflow:hidden}
.ctxbar i{display:block;height:100%;background:var(--blue);border-radius:3px}
a.jump{color:var(--blue);text-decoration:none;font-size:12px;white-space:nowrap}
.agents{border-top:1px solid var(--line)}
.detail{border-top:1px solid var(--line);background:var(--card2);padding:10px 12px;font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;color:var(--dim);margin-bottom:8px}
.kv b{color:var(--fg);font-weight:500;word-break:break-all}
/* flex, NOT float: a floated ⤢ button narrows the conversation box that follows it */
.dhead{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.4px;margin:8px 0 10px;
  display:flex;align-items:center;justify-content:space-between;gap:8px}
/* the skill / slash command this turn is running */
.runskill{color:var(--amber);font-weight:700;white-space:nowrap}
.dhead .expandbtn{float:none;flex:0 0 auto}
/* the needs-you conversation renders OUTSIDE .detail (which supplies the gutter),
   so its header carries the card's own padding + the ctxbox's top border */
.chead{border-top:1px solid var(--line);background:#10141b;padding:8px 12px 0;margin:0}
.chead+.ctxbox{border-top:none;padding-top:4px}
/* dropdowns: no native marker; a rotating chevron + quiet card-styled summaries */
details.foldbox summary,details.dfold summary,details.insfold summary{list-style:none;cursor:pointer;user-select:none}
details.foldbox summary::-webkit-details-marker,details.dfold summary::-webkit-details-marker,
details.insfold summary::-webkit-details-marker{display:none}
details.foldbox summary::before,details.dfold summary::before,details.insfold summary::before{
  content:'▸';display:inline-block;width:15px;color:var(--faint);transition:transform .15s ease}
details.foldbox[open]>summary::before,details.dfold[open]>summary::before,
details.insfold[open]>summary::before{transform:rotate(90deg)}
details.foldbox{margin-top:14px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;overflow:clip}
details.foldbox>summary{color:var(--fg);font-size:13px;font-weight:500;padding:10px 12px}
details.foldbox>summary:hover{background:var(--card2)}
details.foldbox[open]>summary{border-bottom:1px solid var(--line)}
details.foldbox .insfold,details.foldbox .insbar,details.foldbox table,
details.foldbox .setnum,details.foldbox .ctxload{margin-left:8px;margin-right:8px}
/* the container wraps title AND content when open (mirrors .foldbox) */
details.dfold{margin:2px 0 8px;background:var(--card);border:1px solid var(--line);
  border-radius:8px;overflow:clip}
details.dfold>summary{color:var(--dim);font-size:12px;padding:7px 10px}
details.dfold>summary:hover{color:var(--fg)}
details.dfold[open]>summary{color:var(--fg);border-bottom:1px solid var(--line)}
details.dfold .kv{margin:8px 10px}
details.dfold .foldscroll{padding:2px 10px 6px}
details.insfold>summary:hover{color:var(--fg)}
.crow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:12px}
.crow .cname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow small{color:var(--faint)}
.pend{border-top:1px solid var(--amber);background:#1c1810;padding:10px 12px}
.pend .ptool{color:var(--amber);font-weight:600;font-size:12px;margin-bottom:6px}
.pend .qtext{font-size:13px;margin:4px 0 8px;white-space:pre-wrap}
.pend pre{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:11px;
          max-height:180px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin-bottom:8px;
          overscroll-behavior:contain}
.optbtn{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
        border-radius:8px;padding:8px 10px;margin:6px 0;color:var(--fg);font:inherit;font-size:13px;cursor:pointer}
.optbtn small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
.optbtn:active{background:var(--card2)}
.optbtn.sel{border-color:var(--blue);background:#101c2c}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pbtn{border:none;border-radius:8px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.pbtn.allow{background:var(--green);color:#04170a}
.pbtn.always{background:#1d4029;color:var(--green)}
.pbtn.deny{background:#3a1518;color:var(--red)}
.pbtn.send{background:var(--blue);color:#03121f}
.freetext{display:flex;gap:8px;margin-top:10px}
.freetext input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;
                padding:8px 10px;color:var(--fg);font:inherit;font-size:13px}
.actmsg{font-size:12px;margin-top:6px;color:var(--dim)}
.arow{display:flex;align-items:center;gap:8px;padding:7px 12px;border-top:1px solid #20262e;font-size:12px}
.arow:first-child{border-top:none}
/* spawn marker — reads as a branch off the session, like the TUI's tool tree.
   ⎿'s horizontal stroke sits at the BOTTOM of its em box, so the glyph is lifted
   until that stroke lines up with the state dot beside it. */
.tree{color:var(--faint);flex-shrink:0;margin-right:-2px;font-size:13px;line-height:1;
  position:relative;top:-4px}
.copyable{cursor:copy}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.running{background:var(--green);animation:pulse 1.2s infinite}
.dot.done{background:var(--faint)}
.dot.ended{background:var(--red);opacity:.5}
.dot.stalled{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
.atype{font-weight:600;white-space:nowrap}
.adesc{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.amodel{color:var(--purple);white-space:nowrap}
.anum{font-variant-numeric:tabular-nums;color:var(--dim);white-space:nowrap}
.acost{font-variant-numeric:tabular-nums;color:var(--fg);white-space:nowrap}
svg.spark{flex-shrink:0}
.done-row{opacity:.55}
#rollup{margin-top:22px}
#rollup h2{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{color:var(--faint);font-weight:600}
td.r,th.r{text-align:right}
.empty{color:var(--faint);padding:18px;text-align:center}
.ctxbox{border-top:1px solid var(--line);background:#10141b;padding:8px 12px}
.convo{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;padding:2px 0;
       -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.convo.short{max-height:150px}
.cmsg{margin:8px 0}
.cmsg .crole{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px}
.cmsg .cbody{border-radius:8px;padding:6px 9px;font-size:12.5px;overflow-wrap:break-word}
.cmsg .cbody p{margin:9px 0}
.cmsg .cbody p:first-child,.cmsg .cbody>*:first-child{margin-top:2px}
.cmsg .cbody p:last-child,.cmsg .cbody>*:last-child{margin-bottom:2px}
.cmsg.user .cbody{background:#132030;border:1px solid #1f3a5f}
.cmsg.assistant .cbody{background:var(--card);border:1px solid var(--line)}
/* system events folded into the convo: compaction, model fallback, API errors,
   slash commands, and the full text of questions you answered */
.cevt{margin:8px 0;padding:6px 9px;border-radius:8px;border:1px solid var(--line);
  border-left:3px solid var(--dim);background:#12161c}
.cevt.warning{border-left-color:var(--amber);background:#1c1810}
.cevt.error{border-left-color:var(--red);background:#1e1414}
.cevt .evline{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
.cevt .evline b{color:var(--fg);font-weight:600}
.cevt.warning .evline b{color:var(--amber)}
.cevt.error .evline b{color:var(--red)}
.cevt .evi{opacity:.8}
.cevt .evn{font-size:11px;color:var(--faint)}
.cevt .evd{font-size:11.5px;color:var(--dim);margin-top:3px;overflow-wrap:break-word}
.qawrap{margin-top:6px;display:flex;flex-direction:column;gap:6px}
.qarow{border-left:2px solid var(--line);padding-left:8px}
.qaq{font-size:11.5px;color:var(--dim);overflow-wrap:break-word}
.qah{color:var(--faint);text-transform:uppercase;letter-spacing:.4px;font-size:10px;margin-right:5px}
.qaa{font-size:12.5px;color:var(--green);font-weight:600;overflow-wrap:break-word}
.compacting{color:var(--purple)!important}
/* "/" autocomplete over the message input */
.slashwrap{position:relative}
.slashmenu{position:absolute;left:0;right:0;top:2px;z-index:40;max-height:280px;overflow-y:auto;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.5)}
.slashrow{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;cursor:pointer;
  background:none;border:0;border-bottom:1px solid var(--line);padding:7px 10px;color:var(--fg)}
.slashrow:last-child{border-bottom:0}
.slashrow:hover{background:#1b2230}
.slashrow .scmd{font-weight:600;font-size:12.5px;white-space:nowrap}
.slashrow .sdesc{flex:1;min-width:0;font-size:11px;color:var(--dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slashrow .sscope{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px}
.sdanger{color:var(--red);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.slashempty{padding:8px 10px;font-size:11.5px;color:var(--faint)}
.ctool{margin:2px 0 2px 4px}
.ctool .tline{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctool .tline b{color:var(--fg);font-weight:600}
.ctool .tdot{color:var(--green)}
.ctool.cfile{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0 6px 4px}
.fcap{flex-basis:100%;font-size:11px;color:var(--dim)}
.frow{display:flex;align-items:center;gap:8px;padding:4px 0}
.frow .fmeta{flex:1;min-width:0;color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foldscroll{max-height:220px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pfiles{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 8px}
.pfiles .plabel{font-size:11px;color:var(--amber);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.mqsum{font-size:11px;color:var(--blue);margin:2px 0 10px}
.mqnav{display:flex;align-items:center;gap:10px;margin:2px 0 6px}
.mqarr{background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--fg);
       font:inherit;font-size:15px;padding:3px 14px;cursor:pointer}
.mqarr:disabled{color:var(--faint);cursor:default}
.mqarr.cur{border-color:var(--blue);color:var(--blue)}
.insbar{display:flex;align-items:center;gap:8px;padding:6px 0;flex-wrap:wrap}
.insfold{margin:3px 0}
.insfold summary{cursor:pointer;color:var(--dim);font-size:12.5px;padding:5px 2px;user-select:none}
.squiet{margin-left:auto;color:var(--dim);font-size:12px;font-weight:400;white-space:nowrap}
.stripbox{background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;margin:8px 0 0}
.dsep{border-top:1px solid var(--line);margin:26px 0 8px}
.detail>.dhead:first-child{margin-top:0}
/* touch screens: more breathing room between the detail panel's blocks */
@media (pointer:coarse){
  .detail details.dfold{margin:14px 0}
  .detail .dhead{margin-top:16px}
  .detail .stripbox{margin-top:14px}
  .detail .dsep{margin:28px 0 14px}
  .detail .ctxbox{margin-bottom:12px}
}
.mqpos{flex:1;text-align:center;font-size:11px;color:var(--dim)}
.mqpos b{color:var(--fg)}
.ptool{display:flex;align-items:center;gap:8px}
.ptool .ptlabel{flex:1;min-width:0}
.xbtn{background:none;border:1px solid var(--line);border-radius:8px;color:var(--dim);
      font:inherit;font-size:12px;padding:2px 9px;cursor:pointer;white-space:nowrap}
/* stop, like the square on a remote. The square is DRAWN (::before), not a glyph:
   ■ carries font metrics that never center exactly inside the button. */
.stopbtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;
  padding:0;cursor:pointer;border-radius:7px;background:#2a1517;border:1px solid var(--red)}
.stopbtn::before{content:"";display:block;width:12px;height:12px;border-radius:2px;
  background:var(--red)}
.stopbtn:hover{background:var(--red)}
.stopbtn:hover::before{background:#0a0e14}
.fstrip{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
        overscroll-behavior-x:contain;padding-bottom:2px}
.fstrip .fchip{flex:0 0 auto}
.fstrip .fchip.cur{border-color:var(--blue);background:#101c2c}
.ctxload{color:var(--faint);font-size:12px;padding:6px 0}
.fchips{display:flex;gap:6px;flex-wrap:wrap;padding:7px 0 2px}
.fchip{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px 11px;
       color:var(--blue);font:inherit;font-size:12px;cursor:pointer;max-width:100%;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip:disabled{color:var(--faint);cursor:default}
.fchip:active{background:var(--card2)}
#viewer{display:none;position:fixed;inset:0;background:#0a0e14;z-index:50;flex-direction:column}
#vhead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
       padding-top:calc(10px + env(safe-area-inset-top))}
#vtitle{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vclose,#vtheme{background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--fg);
        font:inherit;font-size:14px;padding:5px 12px;cursor:pointer}
#vtheme{font-size:28px;line-height:1;padding:2px 12px}
/* full-screen session view — the card's chat, question block and controls,
   with room to actually read (same overlay shape as the subagent view) */
#sview{display:none;position:fixed;inset:0;background:#0a0e14;z-index:52;flex-direction:column}
#shead2{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
        padding-top:calc(10px + env(safe-area-inset-top))}
#stitle2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stitle2 small{color:var(--dim);font-weight:400;margin-left:8px}
#sctrl{display:flex;align-items:center;gap:6px}
#sclose{background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--fg);
        font:inherit;font-size:14px;padding:5px 12px;cursor:pointer}
#sbody{flex:1;overflow:auto;padding:14px;overscroll-behavior:contain}
#sact{border-top:1px solid var(--line);background:var(--card);
      padding:8px 12px calc(10px + env(safe-area-inset-bottom));max-height:60vh;overflow-y:auto}
#sact .pend{margin:0 0 8px;border-radius:8px;border:1px solid var(--amber)}
#sact .dfold{margin-top:10px}
/* one rule for BOTH docked bars: the file strip → send box gap must match, or the
   two full-screen surfaces stop looking like the same screen */
#sact .stripbox,#vact .stripbox{margin:0 0 8px}
#sact .freetext,#vact .freetext{margin-top:8px}
.expandbtn{float:right;background:var(--card);border:1px solid var(--line);border-radius:8px;
  color:var(--fg);font:inherit;font-size:13px;font-weight:600;padding:7px 14px;cursor:pointer;
  text-transform:none;letter-spacing:0;white-space:nowrap}
.expandbtn:hover{border-color:var(--blue);color:var(--blue)}
/* subagent chat overlay — same shape as the file viewer, no file strip */
#aview{display:none;position:fixed;inset:0;background:#0a0e14;z-index:55;flex-direction:column}
#ahead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
       padding-top:calc(10px + env(safe-area-inset-top))}
#atitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#atitle small{color:var(--dim);font-weight:400;margin-left:8px}
#aclose{background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--fg);
        font:inherit;font-size:14px;padding:5px 12px;cursor:pointer}
#abody{flex:1;overflow:auto;padding:14px;overscroll-behavior:contain}
#aact{border-top:1px solid var(--line);background:var(--card);
      padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
#aact .dfold{margin-top:10px}
.aconvo{max-width:760px}

  onclick="settingsOpen=!settingsOpen;renderSettings()">⚙</button></h1>

read-only: this device has no act token — buttons won't work until you open the <code>?token=…</code> URL once</div>

</div>

</div>

  <div id="shead2"><button id="sclose" onclick="closeSession()">✕</button><span id="stitle2"></span>
    <span id="sctrl"></span></div>

  <div id="sact"></div>

<script>
const $=q=>document.querySelector(q);
(()=>{const m=location.search.match(/[?&]token=([0-9a-f]+)/);
  if(m){document.cookie=`act_token=${m[1]};path=/;max-age=31536000;SameSite=Lax`;
        history.replaceState(null,'',location.pathname);}})();
const open=new Set();
const infoOpen=new Set(),doneOpen=new Set(),filesOpen=new Set();  // detail-panel fold state, survives re-renders
// input guard, two windows: a scroll gesture (touchmove OR desktop wheel/trackpad)
// holds POLL re-renders 1500ms so the scrollbox isn't replaced mid-gesture (a
// replaced node kills wheel momentum: "scroll stops after a second"); a tap
// (touchstart) holds them 800ms so the 2s tick can't detach a button between
// touch and its click event (detached node = swallowed click). User-action
// renders pass force=true and bypass the guard — tap feedback must paint
// immediately.
let lastMove=0,lastTap=0;
document.addEventListener('touchstart',()=>{lastTap=Date.now()},{passive:true});
document.addEventListener('touchmove',()=>{lastMove=Date.now()},{passive:true});
document.addEventListener('wheel',()=>{lastMove=Date.now()},{passive:true});
const touching=()=>Date.now()-lastMove<1500||Date.now()-lastTap<800;
// scrollbar auto-hide: thumbs are transparent until the element actually scrolls
// (class fades 700ms after the last scroll event). Deliberately NOT tied into
// lastMove — programmatic scrolls (sticky-bottom restores) fire scroll events
// too, and feeding those into the render guard would starve re-renders.
let sbFade;
document.addEventListener('scroll',e=>{
  const el=e.target===document?document.documentElement:e.target;
  if(el.classList)el.classList.add('scrolling');
  clearTimeout(sbFade);
  sbFade=setTimeout(()=>document.querySelectorAll('.scrolling').forEach(x=>x.classList.remove('scrolling')),700);
},{passive:true,capture:true});
const fmt$=v=>'$'+(v>=100?v.toFixed(0):v>=10?v.toFixed(1):v.toFixed(2));
const fmtTok=v=>v>=1e6?(v/1e6).toFixed(2)+'M':v>=1e3?(v/1e3).toFixed(0)+'k':v;
const fmtAge=s=>s>=86400?Math.round(s/86400)+'d':s>=3600?Math.round(s/3600)+'h':s>=60?Math.round(s/60)+'m':s+'s';
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stateLabel={running:'running',needs_you:'needs you',turn_done:'done ✓',idle:'idle',stalled:'stalled',stalled_or_prompt:'prompt?',dormant:'dormant'};

function spark(pts,w=64,h=16){
  if(!pts||pts.length<2)return'';
  const min=Math.min(...pts),max=Math.max(...pts),r=max-min||1;
  const p=pts.map((v,i)=>`${(i/(pts.length-1)*w).toFixed(1)},${(h-2-(v-min)/r*(h-4)).toFixed(1)}`).join(' ');
  return`<svg class="spark" width="${w}" height="${h}"><polyline points="${p}" fill="none" stroke="#58a6ff" stroke-width="1.5"/></svg>`;
}

// ---- tiny markdown renderer (self-contained: no CDN on the tailnet path) ----
function mdInline(s){
  return esc(s).split(/(`[^`]*`)/).map(p=>{
    if(p.length>1&&p.startsWith('`')&&p.endsWith('`'))return'<code>'+p.slice(1,-1)+'</code>';
    return p
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
      .replace(/\*([^*\n]+)\*/g,'<i>$1</i>');
  }).join('');
}
function md(src){
  const lines=(src||'').replace(/\r/g,'').split('\n');
  let html='',i=0,m;
  const isList=l=>/^\s*([-*+]|\d+\.)\s+/.test(l);
  const cells=r=>r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
  const isTableSep=l=>/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(l)&&l.includes('-');
  while(i<lines.length){
    const l=lines[i];
    if(/^\s*```/.test(l)){
      const buf=[];i++;
      while(i<lines.length&&!/^\s*```/.test(lines[i]))buf.push(lines[i++]);
      i++;html+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>';continue;
    }
    if(!l.trim()){i++;continue;}
    if(m=l.match(/^(#{1,6})\s+(.*)/)){const n=m[1].length;html+=`<h${n}>${mdInline(m[2])}</h${n}>`;i++;continue;}
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){html+='<hr>';i++;continue;}
    if(/^\s*>/.test(l)){
      const buf=[];while(i<lines.length&&/^\s*>/.test(lines[i]))buf.push(lines[i++].replace(/^\s*>\s?/,''));
      html+='<blockquote>'+md(buf.join('\n'))+'</blockquote>';continue;
    }
    if(isList(l)){
      const ord=/^\s*\d+\./.test(l),items=[];
      while(i<lines.length&&isList(lines[i])){
        let it=lines[i].replace(/^\s*([-*+]|\d+\.)\s+/,'');i++;
        while(i<lines.length&&/^\s{2,}\S/.test(lines[i])&&!isList(lines[i]))it+=' '+lines[i++].trim();
        items.push(it);
      }
      html+=(ord?'<ol>':'<ul>')+items.map(x=>'<li>'+mdInline(x)+'</li>').join('')+(ord?'</ol>':'</ul>');continue;
    }
    if(l.includes('|')&&i+1<lines.length&&isTableSep(lines[i+1])){
      const head=cells(l);i+=2;let rows='';
      while(i<lines.length&&lines[i].includes('|')&&lines[i].trim())
        rows+='<tr>'+cells(lines[i++]).map(c=>'<td>'+mdInline(c)+'</td>').join('')+'</tr>';
      html+='<table><tr>'+head.map(c=>'<th>'+mdInline(c)+'</th>').join('')+'</tr>'+rows+'</table>';continue;
    }
    const buf=[l];i++;
    while(i<lines.length&&lines[i].trim()&&!/^\s*(#{1,6}\s|```|>)/.test(lines[i])
          &&!isList(lines[i])&&!(lines[i].includes('|')&&i+1<lines.length&&isTableSep(lines[i+1])))
      buf.push(lines[i++]);
    html+='<p>'+buf.map(mdInline).join('<br>')+'</p>';
  }
  return html;
}

// ---- conversation context + delivered files (fetched per session on demand) ----
const ctxCache={};   // sid -> {v, messages, files} | {fetching:true}
const ctxVersion=s=>(s.convo_v||'')+':'+(s.files_n||0);
async function ensureCtx(sid,v){
  const c=ctxCache[sid];
  if(c&&(c.v===v||c.fetching))return;
  ctxCache[sid]={...(c||{}),fetching:true};
  try{
    const r=await fetch('/api/context?sid='+encodeURIComponent(sid),{cache:'no-store'});
    const d=await r.json();
    ctxCache[sid]=d.ok?{v,messages:d.messages||[],files:d.files||[]}:{v,messages:[],files:[]};
    render(last);
  }catch(e){delete ctxCache[sid];}
}
// "opus · high". Effort comes from the statusline side-write, so a session whose
// statusline hasn't rendered yet (or isn't installed) shows the model alone.
const modelLabel=s=>esc(s.family||'?')+(s.effort?` · ${esc(s.effort)}`:'');
const enc=v=>encodeURIComponent(v||'').replace(/'/g,'%27');  // onclick-attr-safe
const cpb=v=>`<b class="copyable" title="tap to copy" data-copy="${esc(v)}" onclick="copyTxt(event,this)">${esc(v)}</b>`;
function fchip(sid,f,cap){
  return`<button class="fchip" ${f.missing?'disabled':''} title="${esc(cap||f.path)}"
    onclick="event.stopPropagation();viewFile('${sid}','${enc(f.path)}','${enc(f.name)}','${f.kind}','${enc(cap)}')">${f.kind==='image'?'🖼':'📄'} ${esc(f.name)}${f.missing?' (gone)':''}</button>`;
}
const EVT_ICON={compact:'⧉',model:'⇄',api_error:'⚠',command:'›',qa:'☑'};
function eventRow(m){
  if(m.kind==='qa'){
    const rows=(m.qa||[]).map(q=>`<div class="qarow">
      <div class="qaq">${q.header?`<span class="qah">${esc(q.header)}</span>`:''}${esc(q.q)}</div>
      <div class="qaa">${esc(q.a||'—')}</div></div>`).join('');
    return`<div class="cevt info"><div class="evline"><span class="evi">☑</span> <b>You answered Claude's questions</b></div>
      <div class="qawrap">${rows}</div></div>`;
  }
  return`<div class="cevt ${m.level||'info'}">
    <div class="evline"><span class="evi">${EVT_ICON[m.kind]||'•'}</span> <b>${esc(m.title)}</b>${m.n>1?`<span class="evn">×${m.n}</span>`:''}</div>
    ${m.detail?`<div class="evd">${esc(m.detail)}</div>`:''}</div>`;
}
function convoMsgs(c,sid){
  return(c.messages||[]).map(m=>{
    if(m.role==='event')return eventRow(m);
    if(m.role==='tool'){
      if(m.name==='SendUserFile')
        return`<div class="ctool cfile">${(m.files||[]).map(f=>fchip(sid,f,m.caption)).join('')}
          ${m.caption?`<div class="fcap">${esc(m.caption)}</div>`:''}</div>`;
      return`<div class="ctool"><div class="tline"><span class="tdot">●</span> <b>${esc(m.name)}</b>(${esc(m.arg||'')})</div></div>`;
    }
    return`<div class="cmsg ${m.role}"><span class="crole">${m.role==='user'?'you':'claude'}</span>
      <div class="cbody ${m.role==='assistant'?'mdoc':''}">${m.role==='assistant'?md(m.text):'<p>'+esc(m.text).replace(/\n/g,'<br>')+'</p>'}</div></div>`;
  }).join('');
}
function convoBox(s,short){
  const c=ctxCache[s.session_id];
  if(!c||c.fetching&&!c.messages)return'<div class="ctxbox"><div class="ctxload">loading context…</div></div>';
  const msgs=convoMsgs(c,s.session_id);
  if(!msgs)return'';
  return`<div class="ctxbox"><div class="convo${short?' short':''}" data-sid="${s.session_id}">${msgs}</div></div>`;
}
let viewerSid=null;
function toggleTheme(){
  const light=!$('#vbody').classList.contains('light');
  $('#vbody').classList.toggle('light',light);
  $('#vtheme').textContent=light?'☾':'☀︎';
  try{localStorage.setItem('viewer_light',light?'1':'0');}catch(e){}
}
(()=>{try{if(localStorage.getItem('viewer_light')==='1'){$('#vbody').classList.add('light');$('#vtheme').textContent='☾';}}catch(e){}})();
let viewerChatOpen=false,viewerQOpen=true,viewerPath=null;
// one question's full interaction block (options + descriptions + Other + ✕ dismiss);
// shared by the card's amber box (pre='msg') and the viewer's docked bar (pre='vmsg')
function singleQBlock(s,p,pre){
  const sid=s.session_id;
  const q=p.questions[0],ms=q.multiSelect,n=(q.options||[]).length;
  const sel=multiSel[sid]=multiSel[sid]||new Set();
  return`<div class="ptool"><span class="ptlabel">${esc(q.header||'question')} — waiting on you</span>
      <button class="xbtn" title="dismiss — chat about this instead" onclick="sendDismiss('${sid}','${p.nonce}','${pre}')">✕</button></div>
    ${p.files&&p.files.length?`<div class="pfiles"><span class="plabel">read first</span>${p.files.map(f=>fchip(sid,f,f.caption)).join('')}</div>`:''}
    <div class="qtext">${esc(q.question)}</div>
    ${(q.options||[]).map((o,i)=>`<button class="optbtn ${ms&&sel.has(i+1)?'sel':''}"
        onclick="${ms?`toggleOpt('${sid}',${i+1})`:`sendOption('${sid}','${p.nonce}',[${i+1}],'${pre}')`}">
        ${esc(o.label)}${o.description?`<small>${esc(o.description)}</small>`:''}</button>`).join('')}
    <div class="freetext"><input id="oth-${pre}-${sid}" placeholder="Other — type your own answer"
      value="${esc(otherDraft[sid]||'')}" oninput="otherDraft['${sid}']=this.value"
      ${ms?'':`onkeydown="if(event.key==='Enter')sendOther('${sid}','${p.nonce}',${n},'${pre}')"`}>
      ${ms?'':`<button class="pbtn send" onclick="sendOther('${sid}','${p.nonce}',${n},'${pre}')">answer</button>`}</div>
    ${ms?`<div class="pbtns"><button class="pbtn send" onclick="sendMulti('${sid}','${p.nonce}',${n},'${pre}')">submit selection</button></div>`:''}`;
}
// The delivered-file strip: identical markup and position (docked bar, directly
// above the send box) in BOTH full-screen surfaces, so they read as one screen.
// `cur` marks the file the viewer currently shows.
function fileStrip(sid,files){
  if(!files||!files.length)return'';
  return`<div class="stripbox"><div class="fstrip">${files.map(f=>`<button class="fchip ${f.path===viewerPath?'cur':''}"
    ${f.missing?'disabled':''} title="${esc(f.caption||f.path)}"
    onclick="viewFile('${sid}','${enc(f.path)}','${enc(f.name)}','${f.kind}','${enc(f.caption)}')">${f.kind==='image'?'🖼':'📄'} ${esc(f.name)}${f.missing?' (gone)':''}</button>`).join('')}</div></div>`;
}
// horizontal scroll position survives the 2s re-render
function keepStripScroll(root,fn){
  const old=root.querySelector('.fstrip');
  const sl=old?old.scrollLeft:0;
  fn();
  const ns=root.querySelector('.fstrip');
  if(ns)ns.scrollLeft=sl;
}
function renderViewerBar(force){
  if(!viewerSid)return;
  const bar=$('#vact');
  const ae=document.activeElement;
  if(ae&&ae.tagName==='INPUT'&&bar.contains(ae))return;   // don't clobber typing
  if(!force&&touching())return;                           // or a swipe/tap in flight
  const s=((last||{}).sessions||[]).find(x=>x.session_id===viewerSid);
  const old=bar.querySelector&&bar.querySelector('.vconvo');
  const oldScroll=old?{top:old.scrollTop,atBottom:old.scrollTop+old.clientHeight>=old.scrollHeight-12}:null;
  if(s)ensureCtx(viewerSid,ctxVersion(s));
  const c=ctxCache[viewerSid];
  let h=`<div class="togbox">
      <div class="togrow">
        <button class="vchat-toggle" onclick="viewerChatOpen=!viewerChatOpen;renderViewerBar(true)">${viewerChatOpen?'▾ hide conversation':'▸ show conversation'}</button>
        <button class="expandbtn" title="open the full conversation (closes this file)"
          onclick="openSession('${viewerSid}')">⤢ full view</button>
      </div>
      ${viewerChatOpen?`<div class="togbody">${c&&!c.fetching?`<div class="convo vconvo">${convoMsgs(c,viewerSid)||'<div class="ctxload">no conversation yet</div>'}</div>`:'<div class="ctxload">loading conversation…</div>'}</div>`:''}
    </div>`;
  const p=s&&s.pending;
  if(p&&p.kind==='question'&&p.questions&&p.questions.length&&answered[viewerSid]!==p.nonce){
    h+=`<div class="togbox waiting">
      <button class="vchat-toggle" onclick="viewerQOpen=!viewerQOpen;renderViewerBar(true)">${viewerQOpen?'▾ hide question':'▸ show question — waiting on you'}</button>
      ${viewerQOpen?`<div class="togbody">${p.questions.length>1?mqBlock(s,p,'vmsg'):singleQBlock(s,p,'vmsg')}</div>`:''}
    </div>`;
  }

    <div class="freetext"><input id="vft-${viewerSid}" placeholder="send a message  ·  / for commands" autocomplete="off"

function viewFile(sid,ep,en,kind,ecap){
  closeSession();          // the two full-screen surfaces are mutually exclusive
  const path=decodeURIComponent(ep),name=decodeURIComponent(en),cap=decodeURIComponent(ecap||'');
  const url='/api/file?sid='+encodeURIComponent(sid)+'&p='+encodeURIComponent(path);
  $('#vtitle').textContent=name+(cap?' — '+cap:'');
  $('#viewer').style.display='flex';
  viewerSid=sid;viewerPath=path;renderViewerBar(true);

  if(kind==='image'){vb.innerHTML=`<img src="${url}" alt="${esc(name)}">`;return;}
  vb.textContent='loading…';
  fetch(url,{cache:'no-store'}).then(async r=>{
    if(!r.ok){vb.textContent=(r.status===403?'read-only device — open the ?token= URL once to view files. ':'')+await r.text();return;}
    const t=await r.text();
    vb.innerHTML=/\.(md|markdown)$/i.test(name)?'<div class="mdoc">'+md(t)+'</div>':'<pre class="raw">'+esc(t)+'</pre>';

function closeViewer(){$('#viewer').style.display='none';$('#vbody').innerHTML='';$('#vact').innerHTML='';

// ---- full-screen session view ----------------------------------------------
// Same overlay shape as the subagent view, but this one is a real terminal
// channel: send box, question block, interrupt/mute. Ids use the `sft-`/`smsg-`
// prefixes — the card's `ft-`/`msg-` elements coexist in the DOM.
let sessionView=null;            // {sid, closed} of the open overlay
let sessQOpen=true;              // the question block inside the chat view
const closedCtx={};              // sid -> {messages, info} for CLOSED sessions
function openSession(sid){
  closeViewer();           // never stack the file viewer and the chat view
  sessionView={sid,closed:false};
  $('#sview').style.display='flex';
  renderSession(true);
}
// a closed session has no process: read its transcript, offer no controls
function openClosed(sid){
  closeViewer();
  sessionView={sid,closed:true};
  $('#sview').style.display='flex';
  renderClosed(true);
}
function closeSession(){
  sessionView=null;slashClose();
  $('#sview').style.display='none';$('#sbody').innerHTML='';$('#sact').innerHTML='';
}
async function renderClosed(){
  if(!sessionView||!sessionView.closed)return;
  const sid=sessionView.sid;
  const body=$('#sbody');
  $('#sctrl').innerHTML='';
  $('#sact').innerHTML=`<div class="relaynote">this session is <b>closed</b> — its terminal is gone,
    so there is nothing to send to. The conversation is read-only.</div>`;
  if(!closedCtx[sid]){
    body.innerHTML='<div class="ctxload">loading conversation…</div>';
    try{
      const r=await fetch('/api/closed_context?sid='+encodeURIComponent(sid),{cache:'no-store'});
      const d=await r.json();
      closedCtx[sid]=d.ok?{messages:d.messages||[],info:d.info||{}}
                         :{messages:[],info:{},error:d.error||'unavailable'};
    }catch(e){closedCtx[sid]={messages:[],info:{},error:String(e)};}
    if(!sessionView||sessionView.sid!==sid)return;      // closed while fetching
  }
  const c=closedCtx[sid],info=c.info||{};
  const meta=((last&&last.closed)||[]).find(x=>x.session_id===sid)||{};
  $('#stitle2').innerHTML=`<b>${esc(meta.title||info.project||'closed session')}</b>
    <small>${esc(info.project||meta.project||'')}${info.branch&&info.branch!=='HEAD'?` · ${esc(info.branch)}`:''} · closed</small>`;
  if(c.error)body.innerHTML=`<div class="ctxload">✗ ${esc(c.error)}</div>`;
  else if(!c.messages.length)body.innerHTML='<div class="ctxload">no conversation recorded</div>';
  else body.innerHTML=`<div class="aconvo">${convoMsgs(c,sid)}</div>`;
  body.scrollTop=body.scrollHeight;
}
function renderSession(force){
  if(!sessionView||!last)return;
  if(sessionView.closed)return renderClosed(force);
  const s=(last.sessions||[]).find(x=>x.session_id===sessionView.sid);
  if(!s){closeSession();return;}          // session died while open
  ensureCtx(s.session_id,ctxVersion(s));
  const c=ctxCache[s.session_id];
  const ae=document.activeElement;
  const typing=ae&&(ae.tagName==='INPUT')&&$('#sview').contains(ae);
  const done=['done','ended'];
  $('#stitle2').innerHTML=`<b>${esc(s.title||s.project)}</b>
    <small>${esc(s.project)}${s.branch&&s.branch!=='HEAD'?` · ${esc(s.branch)}`:''} · ${modelLabel(s)}</small>`;
  $('#sctrl').innerHTML=`${s.reg_status==='busy'?`<button class="stopbtn" title="stop the current turn (Esc)"
      onclick="sendInterrupt('${s.session_id}','smsg')"></button>`:''}`;
  if(!force&&(typing||touching()))return;
  const body=$('#sbody');
  const old={top:body.scrollTop,atBottom:body.scrollTop+body.clientHeight>=body.scrollHeight-12};
  if(!c||!c.messages)body.innerHTML='<div class="ctxload">loading conversation…</div>';
  else if(!c.messages.length)body.innerHTML='<div class="ctxload">no conversation yet</div>';
  else body.innerHTML=`<div class="aconvo">${convoMsgs(c,s.session_id)}</div>`;
  body.scrollTop=old.atBottom?body.scrollHeight:old.top;
  if(typing)return;                        // never replace the input being typed into
  const p=s.pending;
  const hasQ=p&&p.kind==='question'&&p.questions&&p.questions.length&&answered[s.session_id]!==p.nonce;
  const qHtml=hasQ?`<div class="togbox waiting">
      <button class="vchat-toggle" onclick="sessQOpen=!sessQOpen;renderSession(true)">${sessQOpen?'▾ hide question':'▸ show question — waiting on you'}</button>
      ${sessQOpen?`<div class="togbody">${p.questions.length>1?mqBlock(s,p,'smsg'):singleQBlock(s,p,'smsg')}</div>`:''}
    </div>`
    :pendingBox(s,'smsg');   // permission prompts render whole
  const act=$('#sact');
  keepStripScroll(act,()=>{act.innerHTML=`
    ${qHtml}
    ${fileStrip(s.session_id,(c&&c.files)||[])}
    <div class="freetext"><input id="sft-${s.session_id}" placeholder="send a message  ·  / for commands" autocomplete="off"
      oninput="slashInput('${s.session_id}','sft')" onfocus="slashInput('${s.session_id}','sft')"
      onkeydown="if(event.key==='Enter')sendText('${s.session_id}','sft','smsg');if(event.key==='Escape')slashClose()">
      <button class="pbtn send" onclick="sendText('${s.session_id}','sft','smsg')">send</button></div>
    <div class="slashwrap" id="slash-sft-${s.session_id}"></div>
    <div class="actmsg" id="smsg-${s.session_id}"></div>`;});
}

// ---- subagent chat overlay -------------------------------------------------
// A subagent has NO tty: its "send" box relays through the PARENT session (the
// parent forwards with SendMessage), so it is labelled as a relay, not a channel.
let agentView=null;              // {sid, aid} of the open overlay
const agentCache={};             // aid -> {v, messages, info}
let agentInfoOpen2=true;         // the info dropdown INSIDE the overlay (open by default)
function openAgent(sid,aid){
  agentView={sid,aid};
  agentInfoOpen2=true;

}
function closeAgent(){
  agentView=null;agentInfoOpen2=false;
  $('#aview').style.display='none';$('#abody').innerHTML='';$('#aact').innerHTML='';
}
function agentMeta(){
  if(!agentView||!last)return null;
  const s=(last.sessions||[]).find(x=>x.session_id===agentView.sid);
  return s?(s.agents||[]).find(a=>a.agent_id===agentView.aid):null;
}
async function ensureAgentCtx(){
  if(!agentView)return;
  const a=agentMeta(),aid=agentView.aid;
  const v=a?a.convo_v:0;
  const c=agentCache[aid];
  if(c&&c.v===v)return;
  if(c&&c.fetching)return;
  agentCache[aid]={...(c||{}),fetching:true};
  try{
    const r=await fetch(`/api/agent_context?sid=${encodeURIComponent(agentView.sid)}&aid=${encodeURIComponent(aid)}`,{cache:'no-store'});
    const d=await r.json();
    agentCache[aid]=d.ok?{v,messages:d.messages||[],info:d.info||{}}:{v,messages:[],info:{}};
  }catch(e){delete agentCache[aid];}
  renderAgent(true);
}
function renderAgent(force){
  if(!agentView)return;
  ensureAgentCtx();
  const a=agentMeta(),c=agentCache[agentView.aid];
  const info=(c&&c.info)||{};
  const done=a?['done','ended'].includes(a.state):true;
  $('#atitle').innerHTML=`<b>${esc(info.agent_type||(a&&a.agent_type)||'subagent')}</b>

  if(!c||!c.messages){body.innerHTML='<div class="ctxload">loading conversation…</div>';}
  else if(!c.messages.length){body.innerHTML='<div class="ctxload">no conversation yet</div>';}
  else body.innerHTML=`<div class="aconvo">${convoMsgs(c,agentView.sid)}</div>`;
  body.scrollTop=old.atBottom?body.scrollHeight:old.top;
  if(!typing){
    const ago=ts=>ts?fmtAge(Math.max(0,Math.round((Date.now()-Date.parse(ts))/1000)))+' ago':'?';
    const tk=info.tokens||{};
    $('#aact').innerHTML=`
      <div class="relaynote">${done?'this agent has finished — ':''}subagents have no terminal of their own:
        your message is typed into the <b>parent session</b>, tagged for it to forward with SendMessage</div>
      <div class="freetext"><input id="aft" placeholder="relay a message via the parent session" autocomplete="off"
        onkeydown="if(event.key==='Enter')sendRelay()">
        <button class="pbtn send" onclick="sendRelay()">relay</button></div>
      <div class="actmsg" id="amsg"></div>
      <details class="dfold" ${agentInfoOpen2?'open':''} ontoggle="agentInfoOpen2=this.open">
        <summary>agent info</summary>

          <span>agent</span>${cpb(info.agent_id||agentView.aid)}
          <span>type</span><b>${esc(info.agent_type||'?')}</b>
          <span>description</span><b>${esc(info.description||'—')}</b>
          <span>model</span><b>${esc(info.model||'?')}${info.effort?` · ${esc(info.effort)}`:''}</b>
          <span>state</span><b>${a?a.state:'closed'}${a&&!done?` · quiet ${fmtAge(a.quiet_s)}`:''}</b>
          <span>parent</span>${cpb(agentView.sid)}
          <span>started</span><b>${ago(info.started)}</b>
          <span>last activity</span><b>${ago(info.last)}</b>
          <span>tokens</span><b>${fmtTok(tk.in||0)} in · ${fmtTok(tk.cache_write||0)} cache write · ${fmtTok(tk.cache_read||0)} cache read · ${fmtTok(tk.out||0)} out</b>
          <span>cost</span><b>${fmt$(info.cost||0)}</b>

function sendRelay(){

function sessionCard(s){

async function setNotify(k,v){

}
async function setNum(k,v){

// multi-question asks: ONE question on screen at a time, ‹ › to move between them
// (keeps a 3-question ask from swallowing the whole screen)
function mqBlock(s,p,pre){
  const sid=s.session_id;
  let st=mqSel[sid];
  if(!st||st.nonce!==p.nonce)st=mqSel[sid]={nonce:p.nonce,qi:0,a:{},other:{}};
  const qs=p.questions;
  if(st.qi>=qs.length)st.qi=qs.length-1;
  const qi=st.qi,q=qs[qi],ms=!!q.multiSelect;
  const sel=st.a[qi]||new Set();
  const ansd=i=>((st.a[i]&&st.a[i].size)||(st.other[i]||'').trim())?1:0;
  const donecnt=qs.reduce((a,_,i)=>a+ansd(i),0);
  const oth=(st.other[qi]||'').trim();
  const picked=[...sel].sort().map(d=>(q.options[d-1]||{}).label)
    .concat(oth?['“'+oth+'”']:[]).join(', ');
  return`<div class="ptool"><span class="ptlabel">multi-part question (${qs.length}) — waiting on you</span>
      <button class="xbtn" title="dismiss — chat about this instead" onclick="sendDismiss('${sid}','${p.nonce}','${pre}')">✕</button></div>
    ${p.files&&p.files.length?`<div class="pfiles"><span class="plabel">read first</span>${p.files.map(f=>fchip(sid,f,f.caption)).join('')}</div>`:''}
    <div class="mqnav"><button class="mqarr" ${qi===0?'disabled':''} onclick="mqNav('${sid}',-1)">‹</button>
      <span class="mqpos"><b>${qi+1}</b> of ${qs.length} · ${donecnt}/${qs.length} answered</span>
      <button class="mqarr" ${qi===qs.length-1?'disabled':''} onclick="mqNav('${sid}',1)">›</button></div>
    <div class="qtext"><b>${esc(q.header||'')}</b> ${esc(q.question)}${ms?' <small>(pick all that apply)</small>':''}</div>
    ${(q.options||[]).map((o,i)=>`<button class="optbtn ${sel.has(i+1)?'sel':''}"
        onclick="mqToggle('${sid}',${qi},${i+1},${ms},${qs.length})">${esc(o.label)}${o.description?`<small>${esc(o.description)}</small>`:''}</button>`).join('')}
    <div class="freetext"><input placeholder="Other — type your own answer" value="${esc(st.other[qi]||'')}"
      oninput="mqOther('${sid}',${qi},this.value)"></div>
    <div class="mqsum">selected: ${picked?esc(picked):'—'}</div>
    <div class="pbtns"><button class="pbtn send" onclick="mqSend('${sid}','${p.nonce}','${pre}')">submit all answers</button></div>`;
}
function mqToggle(sid,qi,d,multi,total){
  const st=mqSel[sid];if(!st)return;
  const sel=st.a[qi]||(st.a[qi]=new Set());
  if(multi){sel.has(d)?sel.delete(d):sel.add(d);}
  else{st.a[qi]=new Set([d]);st.other[qi]='';
       if(st.qi<total-1)st.qi++;}      // picked → advance, like the TUI
  uiRefresh();
}
function mqNav(sid,d){const st=mqSel[sid];if(!st)return;st.qi=Math.max(0,st.qi+d);uiRefresh();}
function mqOther(sid,qi,v){const st=mqSel[sid];if(st)st.other[qi]=v;}
function mqSend(sid,nonce,pre){
  const s=((last||{}).sessions||[]).find(x=>x.session_id===sid);
  const p=s&&s.pending;const st=mqSel[sid];
  if(!p||!st||st.nonce!==nonce)return alert('the prompt changed — refresh');
  const answers=[];
  for(let qi=0;qi<p.questions.length;qi++){
    const digits=[...(st.a[qi]||[])].sort();
    const other=(st.other[qi]||'').trim();
    if(!digits.length&&!other){st.qi=qi;uiRefresh();return alert('answer question '+(qi+1)+' first');}
    const a={multi:!!p.questions[qi].multiSelect,n_options:(p.questions[qi].options||[]).length};
    if(a.multi){if(digits.length)a.digits=digits;if(other)a.other=other;}
    else if(other)a.other=other;
    else a.digits=digits;
    answers.push(a);
  }
  act(sid,{type:'multiq',nonce,answers},pre);
}
// On the CARD a question is only a SIGNAL — the option buttons, Other input and
// per-question nav ate the fleet list. Tapping it opens the full view with the
// question expanded. Permission prompts are small and stay inline (allow/deny).
function cardPending(s){
  const p=s.pending;
  if(!p||(p.nonce&&answered[s.session_id]===p.nonce))return'';
  if(p.kind==='permission')return pendingBox(s,'msg');
  if(p.kind!=='question'||!p.questions||!p.questions.length)return'';
  const n=p.questions.length;
  const label=n>1?`multi-part question (${n})`:(p.questions[0].header||'question');
  return`<div class="pend qsignal" onclick="event.stopPropagation();openSessionQ('${s.session_id}')">
    <div class="ptool"><span class="ptlabel">${esc(label)} — waiting on you</span></div>
    ${p.files&&p.files.length?`<div class="pfiles"><span class="plabel">read first</span>${p.files.map(f=>fchip(s.session_id,f,f.caption)).join('')}</div>`:''}
    <button class="pbtn qanswer" onclick="event.stopPropagation();openSessionQ('${s.session_id}')">answer ⤢</button>
  </div>`;
}
function openSessionQ(sid){sessQOpen=true;openSession(sid);}
function pendingBox(s,pre='msg'){
  const p=s.pending; if(!p)return'';
  if(p.nonce&&answered[s.session_id]===p.nonce)return'';   // sent: dismiss instantly
  if(p.kind==='question'){
    if(!p.questions||!p.questions.length)return'';
    return`<div class="pend">${p.questions.length>1?mqBlock(s,p,pre):singleQBlock(s,p,pre)}
      <div class="actmsg" id="${pre}-${s.session_id}"></div></div>`;
  }
  if(p.kind==='permission'){
    return`<div class="pend">
      <div class="ptool">permission: ${esc(p.tool)} — waiting on you</div>
      <pre>${esc(p.input_summary||'')}</pre>
      <div class="pbtns">
        <button class="pbtn allow" onclick="sendPerm('${s.session_id}','${p.nonce}','allow','${pre}')">allow</button>
        <button class="pbtn always" onclick="sendPerm('${s.session_id}','${p.nonce}','always','${pre}')">always allow</button>
        <button class="pbtn deny" onclick="sendPerm('${s.session_id}','${p.nonce}','deny','${pre}')">deny</button>
      </div>
      <div class="actmsg" id="${pre}-${s.session_id}"></div>
    </div>`;
  }
  return'';
}
async function act(sid,payload,pre='msg'){
  const el=document.getElementById(pre+'-'+sid);
  if(el&&payload.type!=='ping')el.textContent='sending…';
  try{
    const r=await fetch('/api/act',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session_id:sid,...payload})});
    const d=await r.json();
    if(el)el.textContent=d.ok?'sent ✓':'✗ '+(d.error||'failed');
    if(!d.ok&&!el)alert(d.error||'failed');
    if(d.ok&&payload.nonce&&['option','multiq','permission','dismiss'].includes(payload.type)){
      answered[sid]=payload.nonce;      // hide the selector NOW, don't wait for the poll
      delete otherDraft[sid];delete mqSel[sid];multiSel[sid]=new Set();
      uiRefresh();
    }
  }catch(e){if(el)el.textContent='✗ '+e;}
}
function sendOption(sid,nonce,digits,pre){
  act(sid,{type:'option',nonce,digits},pre);
}
function toggleOpt(sid,d){
  const s=multiSel[sid];s.has(d)?s.delete(d):s.add(d);uiRefresh();
}
function sendMulti(sid,nonce,n,pre){
  const digits=[...(multiSel[sid]||[])].sort();
  const other=(otherDraft[sid]||'').trim();
  if(!digits.length&&!other)return alert('pick at least one option');
  act(sid,{type:'option',nonce,digits,multi:true,n_options:n,other:other||undefined},pre);
}
function sendOther(sid,nonce,n,pre){
  const other=(otherDraft[sid]||'').trim();
  if(!other)return alert('type your answer first');
  act(sid,{type:'option',nonce,n_options:n,other},pre);
}
function sendDismiss(sid,nonce,pre){
  act(sid,{type:'dismiss',nonce},pre);
}
// desktop only: pointless from the phone — it focuses a tab on the Mac
function focusSession(sid){act(sid,{type:'focus'});}
function sendInterrupt(sid,pre='msg'){
  if(!confirm('Interrupt this session’s current turn (sends Esc)?'))return;

}
function copyTxt(ev,el){
  ev.stopPropagation();
  if(!navigator.clipboard)return;
  navigator.clipboard.writeText(el.dataset.copy).then(()=>{
    const o=el.textContent;el.textContent='copied ✓';
    setTimeout(()=>{el.textContent=o},900);   // UX flash only
  });
}
function sendPerm(sid,nonce,choice,pre='msg'){
  act(sid,{type:'permission',nonce,choice},pre);
}
function sendText(sid,ftPre='ft',msgPre='msg'){
  const inp=document.getElementById(ftPre+'-'+sid);
  const v=(inp&&inp.value||'').trim();
  if(!v)return;
  const cmd=v.startsWith('/')?(cmdCache[sid]||[]).find(c=>c.name===v.split(/\s+/)[0]):null;
  if(cmd&&cmd.danger&&!confirm(`${cmd.name} destroys this session's conversation state.\n\n${cmd.desc}\n\nSend it?`))return;
  slashClose();
  if(inp)inp.value='';        // clear NOW: the round-trip is the terminal's, not yours
  act(sid,{type:'text',text:v},msgPre);
}

// ---- slash-command autocomplete -------------------------------------------
// Menu INSERTS (never sends): most skills take args, and it keeps the send path
// — with its destructive-command confirm — as the single way anything fires.
const cmdCache={};          // sessionId -> [{name,desc,scope,danger}]
let slashBox=null;          // id of the open menu's container, or null
function slashClose(){
  if(!slashBox)return;
  const el=document.getElementById(slashBox);
  if(el)el.innerHTML='';
  slashBox=null;
}
async function slashInput(sid,pre){
  const inp=document.getElementById(pre+'-'+sid);
  const v=(inp&&inp.value)||'';
  // menu lives while the text is a single "/word" — a space means args are being typed
  if(!v.startsWith('/')||/\s/.test(v))return slashClose();
  if(!cmdCache[sid]){
    cmdCache[sid]=[];       // in-flight guard: one fetch per session
    try{
      const r=await fetch('/api/commands?sid='+encodeURIComponent(sid),{cache:'no-store'});
      const d=await r.json();
      cmdCache[sid]=d.commands||[];
    }catch(e){cmdCache[sid]=[];}
  }
  const q=v.slice(1).toLowerCase();
  const hits=cmdCache[sid].filter(c=>c.name.slice(1).toLowerCase().includes(q))
    .sort((a,b)=>(a.name.slice(1).toLowerCase().startsWith(q)?0:1)-(b.name.slice(1).toLowerCase().startsWith(q)?0:1))
    .slice(0,40);
  const box=document.getElementById('slash-'+pre+'-'+sid);
  if(!box)return;
  slashBox='slash-'+pre+'-'+sid;
  box.innerHTML=hits.length?`<div class="slashmenu">${hits.map(c=>`
    <button class="slashrow" onmousedown="event.preventDefault()" onclick="slashPick('${sid}','${pre}','${enc(c.name)}')">
      <span class="scmd">${esc(c.name)}${c.danger?' <span class="sdanger">destructive</span>':''}</span>
      <span class="sdesc">${esc(c.desc||'')}</span>
      <span class="sscope">${esc(c.scope)}</span>
    </button>`).join('')}</div>`
    :`<div class="slashmenu"><div class="slashempty">no command matches “${esc(v)}”</div></div>`;
}
function slashPick(sid,pre,name){
  const inp=document.getElementById(pre+'-'+sid);
  if(!inp)return;
  inp.value=decodeURIComponent(name)+' ';   // trailing space: args go right here
  slashClose();
  inp.focus();
}

async function doSpawn(){
  if(!newDir){spawnMsg='✗ pick a directory first';render(last,true);return;}
  spawnMsg='starting…';render(last,true);
  try{
    const r=await fetch('/api/act',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type:'spawn',cwd:newDir,model:newModel,effort:newEffort,
                           worktree:newWt,worktree_name:newWtName})});
    const d=await r.json();
    if(!d.ok){spawnMsg='✗ '+(d.error||'failed');render(last,true);return;}
    spawnMsg=d.trust_prompt
      ? '⚠ started — but it is waiting on the trust prompt on your Mac ("do you trust the files in this folder?")'
      : 'started ✓ — opening it here as soon as it appears…';
    // a `-w` spawn lands in a NEW dir under the repo, so match by prefix — but only
    // against sessions that did NOT already exist, or we'd hijack a sibling session
    spawnWait={cwd:d.cwd,worktree:newWt,until:Date.now()+120000,
               known:new Set(((last||{}).sessions||[]).map(x=>x.session_id))};
    newOpen=false;render(last,true);
  }catch(e){spawnMsg='✗ '+e;render(last,true);}
}
// a spawned session only enters the fleet once it writes a transcript
function checkSpawn(f){
  if(!spawnWait)return;
  if(Date.now()>spawnWait.until){spawnWait=null;spawnMsg='';return;}
  const s=(f.sessions||[]).find(x=>!spawnWait.known.has(x.session_id)&&
    (x.cwd===spawnWait.cwd||(spawnWait.worktree&&(x.cwd||'').startsWith(spawnWait.cwd+'/'))));
  if(s){spawnWait=null;spawnMsg='';openSession(s.session_id);}
}

let insightsOpen=false,insightsDays=7;
const insightsCache={};   // days -> {t, data, fetching}
function loadInsights(force){
  const c=insightsCache[insightsDays];
  if(!force&&c&&(c.fetching||(c.data&&Date.now()-c.t<60000)))return;
  insightsCache[insightsDays]={...(c||{}),fetching:true};
  fetch('/api/insights?days='+insightsDays,{cache:'no-store'}).then(r=>r.json()).then(d=>{
    insightsCache[insightsDays]={t:Date.now(),data:d};
    render(last,true);
  }).catch(()=>{delete insightsCache[insightsDays];});
}
function setInsightsDays(n){insightsDays=n;render(last,true);loadInsights();}

    const mixTot=(d.token_mix||[]).reduce((a,x)=>({input:a.input+x.input,write:a.write+x.write,
      read:a.read+x.read,output:a.output+x.output}),{input:0,write:0,read:0,output:0});
    const mixRow=x=>`<tr><td>${x.day}</td><td class="r">${x.input.toFixed(2)}</td><td class="r">${x.write.toFixed(2)}</td><td class="r">${x.read.toFixed(2)}</td><td class="r">${x.output.toFixed(2)}</td><td class="r"><b>${(x.input+x.write+x.read+x.output).toFixed(2)}</b></td></tr>`;
    body=`<div class="insbar">${[7,30,90].map(n=>`<button class="mqarr${insightsDays===n?' cur':''}" onclick="setInsightsDays(${n})">${n}d</button>`).join('')}
        <span class="setnum">agents ${fmt$(d.totals.agent_cost)} · sessions active in window ${fmt$(d.totals.session_cost)} (lifetime $) · cache busts ~${fmt$(d.totals.bust_cost||0)}</span></div>`
      +insFold('cache',`cache invalidations — est ${fmt$(d.totals.bust_cost||0)} re-paid in window`,
        insTable([['cause'],['events',1],['tokens re-paid',1],['est $',1]],
          (d.cache_busts||[]).map(x=>`<tr><td>${esc(x.name)}</td><td class="r">${x.events}</td><td class="r">${fmtTok(x.tokens)}</td><td class="r">${x.cost.toFixed(2)}</td></tr>`)))
      +insFold('mix','$ by token class per day — where the money actually goes',
        insTable([['day'],['uncached $',1],['cache write $',1],['cache read $',1],['output $',1],['total',1]],
          (d.token_mix||[]).length?[mixRow({day:'window',...mixTot})].concat(d.token_mix.map(mixRow)):[]))
      +insFold('agents','by agent type',
        insTable([['agent'],['runs',1],['total $',1],['avg $',1],['cache hit',1]],
          d.agents.map(a=>`<tr><td>${esc(a.name)}</td><td class="r">${a.runs}</td><td class="r">${a.cost.toFixed(2)}</td><td class="r">${a.avg.toFixed(3)}</td><td class="r">${a.cache_pct}%</td></tr>`)))
      +insFold('skills','by skill — attributed cost of turns run while the skill was active',
        insTable([['skill'],['uses',1],['total $',1],['avg $/use',1]],
          d.skills.map(s=>`<tr><td>${esc(s.name)}</td><td class="r">${s.uses}</td><td class="r">${s.cost.toFixed(2)}</td><td class="r">${s.avg.toFixed(3)}</td></tr>`)))
      +insFold('tools','by tool — context injected by tool results (est tokens)',
        insTable([['tool'],['uses',1],['tokens in',1],['avg/use',1]],
          d.tools.map(x=>`<tr><td>${esc(x.name)}</td><td class="r">${x.uses}</td><td class="r">${fmtTok(x.tokens)}</td><td class="r">${fmtTok(x.avg_tokens)}</td></tr>`)))
      +insFold('models','by model',
        insTable([['model'],['agents $',1],['sessions $',1]],
          d.models.map(m=>`<tr><td>${esc(m.name)}</td><td class="r">${m.agents.toFixed(2)}</td><td class="r">${m.sessions.toFixed(2)}</td></tr>`)))
      +insFold('projects','by project (sessions active in window; lifetime $)',
        insTable([['project'],['agents $',1],['sessions $',1]],
          d.projects.map(p=>`<tr><td>${esc(p.name)}</td><td class="r">${p.agents.toFixed(2)}</td><td class="r">${p.sessions.toFixed(2)}</td></tr>`)))
      +insFold('bydayy','agent $ by day',
        insTable([['day'],['$',1]],d.by_day.map(x=>`<tr><td>${x.day}</td><td class="r">${x.cost.toFixed(2)}</td></tr>`)))
      +insFold('topsess','top sessions (lifetime $)',
        insTable([['session'],['project'],['$',1]],
          d.top_sessions.map(s=>`<tr><td>${esc(s.title||'?')}</td><td>${esc(s.project||'')}</td><td class="r">${s.cost.toFixed(2)}</td></tr>`)));
  }else if(d&&!d.ok){body=`<div class="ctxload">✗ ${esc(d.error||'failed')}</div>`;}
  return`<details class="foldbox" ${insightsOpen?'open':''} ontoggle="insightsOpen=this.open;if(this.open)loadInsights()">
    <summary>cost insights</summary>${body}</details>`;
}

let last=null;
function render(f,force){
  if(!f||!f.sessions)return;
  const t=f.totals;
  $('#totals').innerHTML=`<span><b>${t.sessions}</b> sessions <i class="sep">·</i> <b>${t.busy}</b> busy</span>
    <span style="color:${t.needs_me?'var(--amber)':'inherit'}"><b>${t.needs_me}</b> need you</span>
    ${t.done?`<span style="color:var(--green)"><b>${t.done}</b> done</span>`:''}
    <span><b>${t.dormant||0}</b> dormant <i class="sep">·</i> <b>${t.agents_running}</b> subagent${t.agents_running===1?'':'s'} running</span>`;
  const ae=document.activeElement;
  const typing=ae&&ae.tagName==='INPUT'&&$('#sessions').contains(ae);
  const typingClosed=ae&&ae.tagName==='INPUT'&&$('#closed').contains(ae);
  // preserve convo scroll positions across the wholesale innerHTML re-render
  const scrolls={};
  document.querySelectorAll('#sessions .convo').forEach(el=>{
    scrolls[el.dataset.sid]={top:el.scrollTop,atBottom:el.scrollTop+el.clientHeight>=el.scrollHeight-12};});
  const typingNew=ae&&(ae.tagName==='INPUT'||ae.tagName==='SELECT')&&$('#newsess').contains(ae);
  if(!typing&&(force||!touching())){
    const live=f.sessions.filter(s=>s.state!=='dormant');
    const dorm=f.sessions.filter(s=>s.state==='dormant');
    $('#sessions').innerHTML=live.length?live.map(sessionCard).join(''):'<div class="empty">no live sessions</div>';
    document.querySelectorAll('#sessions .convo').forEach(el=>{
      const s0=scrolls[el.dataset.sid];
      el.scrollTop=(s0&&!s0.atBottom)?s0.top:el.scrollHeight;});
    if(!typingNew)$('#newsess').innerHTML=newSection();
    $('#dormant').innerHTML=dormantSection(dorm);
    if(!typingClosed)$('#closed').innerHTML=closedSection(f.closed,f.t);
    $('#rollup').innerHTML=insightsSection();
  }
  checkSpawn(f);
  renderViewerBar();
  renderAgent();
  renderSession();
  document.title=(t.needs_me?`(${t.needs_me}) `:'')+'Fleet View';
}

async function tick(){
  try{
    const r=await fetch('/api/fleet',{cache:'no-store'});
    last=await r.json();
    if(last.page_v){if(window.__pv&&window.__pv!==last.page_v)return location.reload();window.__pv=last.page_v;}
    $('#stale').style.display='none';
    render(last);
  }catch(e){$('#stale').style.display='block';}
}
tick();setInterval(tick,2000);
fetch('/api/act',{method:'POST',headers:{'Content-Type':'application/json'},body:'{"type":"ping"}'})
  .then(r=>{$('#notoken').style.display=r.status===403?'block':'none';}).catch(()=>{});
</script>
</body>
