<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- maximum-scale=1 only disables iOS's AUTO-zoom on input focus; pinch zoom
     still works (iOS ignores it for user gestures since iOS 10) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Fleet View</title>
<style>
:root{
  --bg:#0d1117; --card:#161b22; --card2:#1c2330; --line:#2d333b;
  --fg:#e6edf3; --dim:#8b949e; --faint:#57606a;
  --green:#3fb950; --amber:#d29922; --red:#f85149; --blue:#58a6ff; --purple:#bc8cff;
}
*{box-sizing:border-box;margin:0;padding:0}
/* scrollbars hide when idle (vertical + horizontal): transparent by default,
   thumb appears only while the element carries .scrolling (JS scroll listener).
   Standard properties only — in Chrome, setting scrollbar-color disables
   ::-webkit-scrollbar styling, so never mix the two. */
*{scrollbar-width:thin;scrollbar-color:transparent transparent}
.scrolling{scrollbar-color:#4a545f transparent}
body{background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Mono",Menlo,sans-serif;
     padding:12px 12px calc(24px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.pagetitle{font-size:22px;font-weight:700;padding:4px 2px 2px;display:flex;align-items:center}
.pagetitle span{flex:1}
#gear{background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer;padding:2px 6px}
.setpanel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.setrow{display:block;font-size:13px;color:var(--fg);padding:5px 0;cursor:pointer}
.setrow input[type=checkbox]{margin-right:8px;accent-color:var(--blue)}
.setnum{color:var(--dim)}
.setnum input{width:72px;background:var(--card2);border:1px solid var(--line);border-radius:6px;
              color:var(--fg);padding:3px 6px;font:inherit;font-size:13px;margin:0 4px}
.setchoice{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#0b0f14;
  border:1px solid var(--line);border-radius:9px;padding:3px}
.setchoice button{min-height:38px;border:0;border-radius:6px;background:transparent;color:var(--dim);
  font:inherit;font-size:12.5px;cursor:pointer}
.setchoice button[aria-pressed="true"]{background:var(--card2);color:var(--fg);font-weight:600}
.sethint{color:var(--faint);font-size:10.5px;line-height:1.4;margin-top:5px}
#settingsview{display:none;position:fixed;inset:0;background:#0a0e14;z-index:58;flex-direction:column}
#sethead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
  padding-top:calc(10px + env(safe-area-inset-top));position:relative;z-index:20}
#setclose{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:8px;
  color:var(--fg);font:inherit;font-size:18px;line-height:1;padding:7px 12px;cursor:pointer}
#settitle{font-size:16px;font-weight:700}
#settings{flex:1;overflow:auto;padding:14px 14px calc(18px + env(safe-area-inset-bottom));
  overscroll-behavior:contain}
#settings>.setpanel{width:min(100%,760px);margin-inline:auto}
.bell{background:none;border:none;font:inherit;font-size:14px;cursor:pointer;padding:0 2px;opacity:.9}
.bell.muted{opacity:.4}
header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:2px 2px 12px}
#totals{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
#totals b{color:var(--fg);font-variant-numeric:tabular-nums}
#totals .sep{color:var(--faint);font-style:normal;margin:0 7px}
/* Provider account usage: Claude and Codex share the same compact quota gauges. */
#usage{display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:8px 12px;margin-bottom:12px;font-size:12px;color:var(--dim)}
#usage.empty{display:none}
.uprovider{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%}
.uprovider+.uprovider{border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.uaccount+.uaccount{border-top:1px dashed var(--line);padding-top:7px;margin-top:1px}
.uaccount{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%}
.uhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.uname{color:var(--fg);font-weight:700}
.uactive{color:var(--green);font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.45px}
.useg{display:inline-flex;align-items:baseline;gap:8px;min-width:0;max-width:100%}
.usep{color:var(--faint);font-style:normal}
.umeta{color:var(--faint);font-variant-numeric:tabular-nums}
.uemail{color:var(--fg);font-weight:600;overflow-wrap:anywhere}
.ugauge{display:flex;align-items:center;gap:8px;min-width:0}
.ugauge .ulabel{color:var(--faint);text-transform:uppercase;letter-spacing:.4px;font-size:10px}
.ugauge .upct{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:600}
.ubar{width:120px;height:6px;background:var(--card2);border-radius:3px;overflow:hidden;flex:0 0 auto}
.ubar i{display:block;height:100%}
.ureset{color:var(--faint);font-variant-numeric:tabular-nums}
.modesel{background:var(--card2);border:1px solid var(--line);border-radius:6px;color:var(--fg);
  padding:2px 5px;font:inherit;font-size:11px;cursor:pointer}
.modesel:disabled{opacity:.5;cursor:not-allowed}
/* last-message peek — compact Markdown, never a tool call */
.lastmsg{display:flex;align-items:flex-start;gap:7px;padding:6px 12px;font-size:12px;
  color:var(--dim);border-top:1px solid var(--line);background:#0f1319;overflow:hidden}
.lastmsg .lmwho{flex:0 0 auto;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;
  color:var(--faint);line-height:1.45;padding-top:1px}
/* Preview height follows the user's line setting. Overflow is measured after
   layout so the last allotted row can become an explicit expansion control. */
.lastmsg .lmtext{flex:1;min-width:0;line-height:1.45;overflow:hidden;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.lastmsg .peekmd{display:block;-webkit-line-clamp:unset;
  max-height:calc(var(--peek-lines,2) * 1.45em)}
.lastmsg .peekbody{position:relative;flex:1;min-width:0}
.lastmsg .peekbody .lmtext{width:100%}
.sessionpeek.expanded{overflow:visible}
.sessionpeek.expanded .peekmd{max-height:none;overflow:visible}
.peektoggle{display:none;border:0;font:inherit;cursor:pointer}
.sessionpeek.truncated .peektoggle.more{display:block;position:absolute;z-index:1;
  left:0;right:0;bottom:0;width:100%;height:1.45em;padding:0;background:#0f1319;
  color:var(--dim);text-align:left;font-weight:700;letter-spacing:.12em}
.sessionpeek.truncated .peektoggle.more:hover,.sessionpeek.truncated .peektoggle.more:focus-visible{
  background:#151b23;color:var(--fg)}
.sessionpeek.expanded .peektoggle.less{display:block;margin-top:5px;padding:0;background:none;
  color:var(--blue);font-size:11px;font-weight:700;text-align:left}
.sessionpeek.expanded .peektoggle.less:hover,.sessionpeek.expanded .peektoggle.less:focus-visible{
  color:var(--fg);text-decoration:underline}
.peekmd h1,.peekmd h2,.peekmd h3,.peekmd h4,.peekmd h5,.peekmd h6{
  color:var(--fg);font-size:1em;line-height:inherit;font-weight:700;margin:0}
.peekmd p,.peekmd ul,.peekmd ol,.peekmd blockquote{margin:0;line-height:inherit}
.peekmd ul,.peekmd ol{padding-left:18px}
.peekmd li{margin:0}
.peekmd code{color:var(--fg);background:#090c10;border:1px solid var(--line);
  border-radius:3px;padding:0 3px;font-size:.92em}
.peekmd a{color:var(--blue);text-decoration:none;pointer-events:none}
.peekmd blockquote{border-left:2px solid var(--line);padding-left:7px}
.lastmsg .lmwho.user{color:var(--blue)}
.lastmsg.amsgprev{background:none;border-top:none;padding-top:0;padding-bottom:7px;
  font-size:11.5px;cursor:pointer}
#stale{display:none;background:var(--red);color:#fff;border-radius:6px;padding:6px 10px;font-size:12px;margin-bottom:10px}
#providerstate:empty{display:none}
.provideralert{background:#291719;border:1px solid var(--red);color:var(--fg);border-radius:8px;
  padding:7px 10px;font-size:12px;margin-bottom:10px}
.provideralert b{color:var(--red)}
/* Active/error cards use the raised surface. Available inventory stays on the
   quieter base surface; only dormant/headless cards recede in opacity. */
.card{background:var(--card2);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;
  overflow:clip;opacity:1;transition:opacity .12s ease}
.card>.ctop{background:inherit}
.card.needs{border-color:var(--amber)}
.card.stalled{border-color:var(--red)}
.card.idle{background:var(--card);opacity:1}
/* sticky: header pins to the viewport top while its card scrolls past (so a long
   open card can still be collapsed), then exits with the card bottom. Requires the
   card ancestor NOT be a scroll container: overflow:clip above, never hidden. */
.shead{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;user-select:none;
       position:sticky;top:0;z-index:5;background:inherit}
.chip{font-size:11px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap}
.chip.needs_you{background:#2b2111;color:var(--amber)}
.chip.working{background:#12261e;color:var(--green)}
.chip.available{background:var(--card2);color:var(--dim)}
.chip.history{background:var(--card2);color:var(--faint)}
.chip.problem{background:#2d1214;color:var(--red)}
.accessbadge,.newbadge{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;
  color:var(--faint);white-space:nowrap}
.accessbadge.view_only{color:var(--purple)}
.newbadge{color:var(--blue);font-weight:700}
.primarybtn{background:transparent;border:1px solid var(--blue);border-radius:7px;color:var(--blue);
  font:inherit;font-size:11px;font-weight:700;padding:6px 10px;cursor:pointer;white-space:nowrap}
.primarybtn:hover,.primarybtn:focus-visible{background:var(--blue);color:#07111d}
.replysignal{display:flex;align-items:center;justify-content:space-between;gap:8px;
  border-top:1px solid #3a2f16;background:#1c1810;color:var(--amber);padding:7px 12px;
  font-size:11.5px}
.replysignal button{background:none;border:0;color:var(--dim);font:inherit;font-size:11px;
  cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.replysignal button:hover{color:var(--fg)}
.card.dorm{background:var(--card);opacity:.4}
.card.dorm.open{opacity:1}   /* expanding a dim card focuses it */
.sname{font-weight:600;overflow:hidden;flex:1;min-width:0;line-height:1.3}
.sname .stitle,.sname small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sname small{color:var(--dim);font-weight:400}
.scost{font-variant-numeric:tabular-nums;color:var(--fg);font-weight:600;white-space:nowrap}
.smeta{display:flex;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;align-items:center;padding:0 12px 10px;font-size:12px;color:var(--dim)}
/* left = activity (agents · quiet), right = context bar · model - effort */
.smeta-l,.smeta-r{display:flex;align-items:center;flex-wrap:wrap;min-width:0}
.smeta-l>*:not(:first-child)::before,.smeta-r>*:not(:first-child)::before{content:'·';color:var(--faint);margin:0 7px}
.smeta .m{white-space:nowrap}
.ctxwrap{flex:0 0 auto;display:flex;align-items:center;gap:5px}
.ctxbar{width:96px;height:8px;background:#090c11;border:1px solid #566273;
  border-radius:4px;overflow:hidden}
.ctxbar i{display:block;height:100%;background:var(--blue);border-radius:3px}
a.jump{color:var(--blue);text-decoration:none;font-size:12px;white-space:nowrap}
.agents{border-top:1px solid var(--line)}
.detail{border-top:1px solid var(--line);background:var(--card);padding:8px 12px 10px;font-size:12px}
.card.idle .detail,.card.dorm .detail{background:var(--card2)}
.detail .actmsg:empty{display:none}
/* mute control at the top of the tail; equal gap to the first fold below it */
.mutebox{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--dim);margin-bottom:8px}
.mutebox .bell{font-size:17px}
/* top gap above the first fold == the gap between folds */
.detail>details.dfold:first-of-type{margin-top:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;color:var(--dim);margin-bottom:8px}
.kv b{color:var(--fg);font-weight:500;word-break:break-all}
/* flex, NOT float: a floated ⤢ button narrows the conversation box that follows it */
.dhead{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.4px;margin:8px 0 10px;
  display:flex;align-items:center;justify-content:space-between;gap:8px}
/* the skill / slash command this turn is running */
.runskill{color:var(--amber);font-weight:700;white-space:nowrap}
.dhead .expandbtn{float:none;flex:0 0 auto}
/* the needs-you conversation renders OUTSIDE .detail (which supplies the gutter),
   so its header carries the card's own padding + the ctxbox's top border */
.chead{border-top:1px solid var(--line);background:#10141b;padding:8px 12px 0;margin:0}
.chead+.ctxbox{border-top:none;padding-top:4px}
/* dropdowns: no native marker; a rotating chevron + quiet card-styled summaries */
details.foldbox summary,details.dfold summary,details.insfold summary{list-style:none;cursor:pointer;user-select:none}
details.foldbox summary::-webkit-details-marker,details.dfold summary::-webkit-details-marker,
details.insfold summary::-webkit-details-marker{display:none}
details.foldbox summary::before,details.dfold summary::before,details.insfold summary::before{
  content:'▸';display:inline-block;width:15px;color:var(--faint)}
details.foldbox[open]>summary::before,details.dfold[open]>summary::before,
details.insfold[open]>summary::before{content:'▾'}
details.foldbox{margin-top:14px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;overflow:clip}
details.foldbox>summary{color:var(--fg);font-size:13px;font-weight:500;padding:10px 12px}
details.foldbox>summary:hover{background:var(--card2)}
details.foldbox[open]>summary{border-bottom:1px solid var(--line)}
details.foldbox .insfold,details.foldbox .insbar,details.foldbox table,
details.foldbox .setnum,details.foldbox .ctxload{margin-left:8px;margin-right:8px}
/* the container wraps title AND content when open (mirrors .foldbox) */
/* dropdown is duller (matches the panel) when closed, brighter when opened */
details.dfold{margin:2px 0 8px;background:var(--card);border:1px solid var(--line);
  border-radius:8px;overflow:clip}
details.dfold[open]{background:var(--card2)}
details.dfold>summary{color:var(--dim);font-size:12px;padding:7px 10px}
details.dfold>summary:hover{color:var(--fg)}
details.dfold[open]>summary{color:var(--fg);border-bottom:1px solid var(--line)}
details.dfold .kv{margin:8px 10px}
details.dfold .foldscroll{padding:2px 10px 6px}
details.insfold>summary:hover{color:var(--fg)}
.crow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:12px}
.crow .cname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow small{color:var(--faint)}
.queue{margin-top:16px}
.queue:first-child{margin-top:0}
.queuehead{display:flex;align-items:baseline;gap:8px;padding:0 4px 6px;color:var(--fg)}
.queuehead b{font-size:11px;text-transform:uppercase;letter-spacing:.65px}
.queuehead span{font-size:10.5px;color:var(--faint)}
.queue.needs .queuehead b{color:var(--amber)}
.queue.working .queuehead b{color:var(--green)}
.queueempty{background:var(--card);border:1px dashed var(--line);border-radius:9px;
  color:var(--faint);padding:13px;text-align:center;font-size:12px}
.historytools{padding:8px 10px 7px}
.historytools .freetext{margin:0}
.filterline{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:7px 0 0;
  -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.filterlabel{color:var(--faint);font-size:9.5px;text-transform:uppercase;letter-spacing:.45px;
  flex:0 0 auto;margin-right:2px}
.filterchip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;
  color:var(--dim);font:inherit;font-size:10.5px;padding:4px 9px;cursor:pointer}
.filterchip.on{border-color:var(--blue);color:var(--blue);background:#101c2c}
.historyrow{border-bottom:1px solid var(--line)}
.historymain{display:flex;align-items:center;gap:9px;padding:8px 10px;cursor:pointer}
.historymain:hover{background:var(--card2)}
.historyname{flex:1;min-width:0;font-size:12px;line-height:1.3}
.historyname b,.historyname small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.historyname b{font-weight:600;color:var(--fg)}
.historyname small{color:var(--faint)}
.historyreason{font-size:9.5px;text-transform:uppercase;letter-spacing:.35px;color:var(--dim);
  white-space:nowrap}
.historyage{font-size:10.5px;color:var(--faint);white-space:nowrap}
.historyaction{background:transparent;border:1px solid var(--line);border-radius:7px;color:var(--blue);
  font:inherit;font-size:10.5px;font-weight:700;padding:5px 9px;cursor:pointer;white-space:nowrap}
.historyaction:hover{border-color:var(--blue)}
.historydetail{padding:8px 10px 10px;background:var(--card2);border-top:1px solid var(--line);
  font-size:11px}
.historydetail .kv{margin:0}
.pend{border-top:1px solid var(--amber);background:#1c1810;padding:10px 12px}
.pend .ptool{color:var(--amber);font-weight:600;font-size:12px;margin-bottom:6px}
.pend .qtext{font-size:13px;margin:4px 0 8px;white-space:pre-wrap}
.pend pre{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:11px;
          max-height:180px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin-bottom:8px;
          overscroll-behavior:contain}
.optbtn{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
        border-radius:8px;padding:8px 10px;margin:6px 0;color:var(--fg);font:inherit;font-size:13px;cursor:pointer}
.optbtn small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
.optbtn:active{background:var(--card2)}
.optbtn.sel{border-color:var(--blue);background:#101c2c}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pbtn{border:none;border-radius:8px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.pbtn.allow{background:var(--green);color:#04170a}
.pbtn.always{background:#1d4029;color:var(--green)}
.pbtn.deny{background:#3a1518;color:var(--red)}
.pbtn.send{background:var(--blue);color:#03121f}
.freetext{display:flex;gap:8px;margin-top:10px}
.freetext input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;
                padding:8px 10px;color:var(--fg);font:inherit;font-size:13px}
.actmsg{font-size:12px;margin-top:6px;color:var(--dim)}
.arow{display:flex;align-items:center;gap:8px;padding:7px 12px;border-top:1px solid #20262e;font-size:12px}
.arow:first-child{border-top:none}
/* spawn marker — reads as a branch off the session, like the TUI's tool tree.
   ⎿'s horizontal stroke sits at the BOTTOM of its em box, so the glyph is lifted
   until that stroke lines up with the state dot beside it. */
.tree{color:var(--faint);flex-shrink:0;margin-right:-2px;font-size:13px;line-height:1;
  position:relative;top:-4px}
.copyable{cursor:copy}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.running{background:var(--green);animation:pulse 1.2s infinite}
.dot.done{background:var(--faint)}
.dot.ended{background:var(--red);opacity:.5}
.dot.stalled{background:var(--amber);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.atype{font-weight:600;white-space:nowrap}
.adesc{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.amodel{color:var(--purple);white-space:nowrap}
.anum{font-variant-numeric:tabular-nums;color:var(--dim);white-space:nowrap}
.acost{font-variant-numeric:tabular-nums;color:var(--fg);white-space:nowrap}
svg.spark{flex-shrink:0}
.done-row{opacity:.55}
#rollup{margin-top:22px}
#rollup h2{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{color:var(--faint);font-weight:600}
td.r,th.r{text-align:right}
.empty{color:var(--faint);padding:18px;text-align:center}
.ctxbox{border-top:1px solid var(--line);background:#10141b;padding:8px 12px}
.convo{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;padding:2px 0;
       -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.convo.short{max-height:150px}
.cmsg{margin:8px 0}
.cmsg .crole{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px}
.cmsg .cbody{border-radius:8px;padding:6px 9px;font-size:12.5px;overflow-wrap:break-word}
.cmsg .cbody p{margin:9px 0}
.cmsg .cbody p:first-child,.cmsg .cbody>*:first-child{margin-top:2px}
.cmsg .cbody p:last-child,.cmsg .cbody>*:last-child{margin-bottom:2px}
.cmsg.user .cbody{background:#132030;border:1px solid #1f3a5f}
.cmsg.assistant .cbody{background:var(--card);border:1px solid var(--line)}
.cmsg.optimistic .cbody{border-style:dashed}
.delivery{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
  margin-left:5px;padding:0;border:0;background:none;color:var(--dim);font:700 12px/1 monospace;
  vertical-align:middle}
.delivery.sending{animation:sendspin 1s linear infinite;cursor:default}
.delivery.failed{color:var(--red);cursor:pointer;border:1px solid var(--red);border-radius:50%}
.delivery.failed:hover,.delivery.failed:focus-visible{background:#32171b;color:#fff}
.delivery.sent{color:var(--green)}
.quickfeedback{display:flex;align-items:center;gap:7px;min-width:0;margin:7px 12px;
  padding:7px 9px;border:1px solid #1f3a5f;border-radius:8px;background:#132030;
  color:var(--dim);font-size:12px}
.quickfeedback.failed{border-color:#6f2a31;background:#211419;color:var(--red)}
.quickfeedback .qfstate{font-weight:650;color:var(--fg);white-space:nowrap}
.quickfeedback.failed .qfstate{color:var(--red)}
.quickfeedback .qftext{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.quickfeedback .delivery{flex:0 0 auto;margin-left:auto}
@keyframes sendspin{to{transform:rotate(360deg)}}
/* system events folded into the convo: compaction, model fallback, API errors,
   slash commands, and the full text of questions you answered */
.cevt{margin:8px 0;padding:6px 9px;border-radius:8px;border:1px solid var(--line);
  border-left:3px solid var(--dim);background:#12161c}
.cevt.warning{border-left-color:var(--amber);background:#1c1810}
.cevt.error{border-left-color:var(--red);background:#1e1414}
.cevt .evline{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
.cevt .evline b{color:var(--fg);font-weight:600}
.cevt.warning .evline b{color:var(--amber)}
.cevt.error .evline b{color:var(--red)}
.cevt .evi{opacity:.8}
.cevt .evn{font-size:11px;color:var(--faint)}
.cevt .evd{font-size:11.5px;color:var(--dim);margin-top:3px;overflow-wrap:break-word}
.qawrap{margin-top:6px;display:flex;flex-direction:column;gap:6px}
.qarow{border-left:2px solid var(--line);padding-left:8px}
.qaq{font-size:11.5px;color:var(--dim);overflow-wrap:break-word}
.qah{color:var(--faint);text-transform:uppercase;letter-spacing:.4px;font-size:10px;margin-right:5px}
.qaa{font-size:12.5px;color:var(--green);font-weight:600;overflow-wrap:break-word}
.compacting{color:var(--purple)!important}
/* "/" autocomplete over the message input */
.slashwrap{position:relative}
.slashmenu{position:absolute;left:0;right:0;top:2px;z-index:40;max-height:280px;overflow-y:auto;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.5)}
.slashrow{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;cursor:pointer;
  background:none;border:0;border-bottom:1px solid var(--line);padding:7px 10px;color:var(--fg)}
.slashrow:last-child{border-bottom:0}
.slashrow:hover{background:#1b2230}
.slashrow .scmd{font-weight:600;font-size:12.5px;white-space:nowrap}
.slashrow .sdesc{flex:1;min-width:0;font-size:11px;color:var(--dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slashrow .sscope{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px}
.sdanger{color:var(--red);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.slashempty{padding:8px 10px;font-size:11.5px;color:var(--faint)}
.ctool{margin:2px 0 2px 4px}
.ctool .tline{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctool .tline b{color:var(--fg);font-weight:600}
.ctool .tdot{color:var(--green)}
.ctool.cfile{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0 6px 4px}
.fcap{flex-basis:100%;font-size:11px;color:var(--dim)}
.frow{display:flex;align-items:center;gap:8px;padding:4px 0}
.frow .fmeta{flex:1;min-width:0;color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foldscroll{max-height:220px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pfiles{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 8px}
.pfiles .plabel{font-size:11px;color:var(--amber);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.mqsum{font-size:11px;color:var(--blue);margin:2px 0 10px}
.mqnav{display:flex;align-items:center;gap:10px;margin:2px 0 6px}
.mqarr{background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--fg);
       font:inherit;font-size:15px;padding:3px 14px;cursor:pointer}
.mqarr:disabled{color:var(--faint);cursor:default}
.mqarr.cur{border-color:var(--blue);color:var(--blue)}
.insbar{display:flex;align-items:center;gap:8px;padding:6px 0;flex-wrap:wrap}
.insfold{margin:3px 0}
.insfold summary{cursor:pointer;color:var(--dim);font-size:12.5px;padding:5px 2px;user-select:none}
.squiet{margin-left:auto;color:var(--dim);font-size:12px;font-weight:400;white-space:nowrap}
.stripbox{background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;margin:8px 0 0}
.dsep{border-top:1px solid var(--line);margin:26px 0 8px}
.detail>.dhead:first-child{margin-top:0}
/* touch screens: more breathing room between the detail panel's blocks */
@media (pointer:coarse){
  .detail{padding-top:14px}
  .detail details.dfold{margin:14px 0}
  .detail>details.dfold:first-of-type{margin-top:0}
  .detail .dhead{margin-top:16px}
  .detail .stripbox{margin-top:14px}
  .detail .dsep{margin:28px 0 14px}
  .detail .ctxbox{margin-bottom:12px}
  /* phone: trim the dense bits — "quiet …" and the subagent row's numbers after
     the model (throughput, sparkline, tokens, cost). The agent view has it all. */
  .squiet{display:none}
  .arow .anum,.arow .spark,.arow .acost,.arow .aopen{display:none}
  .shead .spin{display:none}
}
@media (max-width:600px){
  .shead>.m[title="session provider"]{display:none}
  .primarybtn{padding:5px 8px;font-size:10.5px}
  .historyreason{display:none}
  .historymain{gap:7px}
  .historymain .spin{padding:7px 8px}
}
.mqpos{flex:1;text-align:center;font-size:11px;color:var(--dim)}
.mqpos b{color:var(--fg)}
.ptool{display:flex;align-items:center;gap:8px}
.ptool .ptlabel{flex:1;min-width:0}
.xbtn{background:none;border:1px solid var(--line);border-radius:8px;color:var(--dim);
      font:inherit;font-size:12px;padding:2px 9px;cursor:pointer;white-space:nowrap}
/* stop, like the square on a remote. The square is DRAWN (::before), not a glyph:
   ■ carries font metrics that never center exactly inside the button. */
.stopbtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;
  padding:0;cursor:pointer;border-radius:7px;background:#2a1517;border:1px solid var(--red)}
.stopbtn::before{content:"";display:block;width:12px;height:12px;border-radius:2px;
  background:var(--red)}
.stopbtn:hover{background:var(--red)}
.stopbtn:hover::before{background:#0a0e14}
.fstrip{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
        overscroll-behavior-x:contain;padding-bottom:2px}
.fstrip .fchip{flex:0 0 auto}
.fstrip .fchip.cur{border-color:var(--blue);background:#101c2c}
.ctxload{color:var(--faint);font-size:12px;padding:6px 0}
.fchips{display:flex;gap:6px;flex-wrap:wrap;padding:7px 0 2px}
.fchip{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px 11px;
       color:var(--blue);font:inherit;font-size:12px;cursor:pointer;max-width:100%;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip:disabled{color:var(--faint);cursor:default}
.fchip:active{background:var(--card2)}
#viewer{display:none;position:fixed;inset:0;background:#0a0e14;z-index:50;flex-direction:column}
#vhead{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
       padding-top:calc(10px + env(safe-area-inset-top));position:relative;z-index:20}
/* session heading (title / project·branch·model), a tight rule, then the file name */
#vtitle{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
#vtitle b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vtitle small{color:var(--dim);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vfsep{align-self:stretch;border-top:1px solid var(--line);margin:5px 0}
.vfname{font-size:12.5px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vclose{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:8px;
        color:var(--fg);font:inherit;font-size:14px;padding:5px 12px;cursor:pointer}
#vctrl{display:flex;align-items:center;gap:6px}
/* full-screen session view — the card's chat, question block and controls,
   with room to actually read (same overlay shape as the subagent view) */
#sview{display:none;position:fixed;inset:0;background:#0a0e14;z-index:52;flex-direction:column}
#shead2{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
        padding-top:calc(10px + env(safe-area-inset-top));position:relative;z-index:20}
/* title on its own line, project · branch · model beneath */
#stitle2{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
#stitle2 b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stitle2 small{color:var(--dim);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sctrl{display:flex;align-items:center;gap:6px}
#sclose{background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--fg);
        font:inherit;font-size:14px;padding:5px 12px;cursor:pointer}
#sbody{flex:1;overflow:auto;padding:14px;overscroll-behavior:contain}
#sact{border-top:1px solid var(--line);background:var(--card);
      padding:8px 12px calc(10px + env(safe-area-inset-bottom));max-height:60vh;overflow-y:auto}
#sact .pend{margin:0 0 8px;border-radius:8px;border:1px solid var(--amber)}
#sact .dfold{margin-top:10px}
/* one rule for BOTH docked bars: the file strip → send box gap must match, or the
   two full-screen surfaces stop looking like the same screen */
#sact .stripbox,#vact .stripbox{margin:0 0 8px}
#sact .freetext,#vact .freetext{margin-top:8px}
/* card tail reveal: session info / files / completed agents / claude.ai link */
.morebtn{display:block;width:100%;background:none;border:none;border-top:1px solid var(--line);
  color:var(--dim);font:inherit;font-size:10px;cursor:pointer;padding:2px 6px;user-select:none;text-align:center}
.morebtn:hover{color:var(--fg);background:var(--card2)}
.expandbtn{float:right;background:var(--card);border:1px solid var(--line);border-radius:8px;
  color:var(--fg);font:inherit;font-size:13px;font-weight:600;padding:7px 14px;cursor:pointer;
  text-transform:none;letter-spacing:0;white-space:nowrap}
.termbtn:disabled{opacity:.38;cursor:not-allowed}
.expandbtn:hover{border-color:var(--blue);color:var(--blue)}
/* subagent chat overlay — same shape as the file viewer, no file strip */
#aview{display:none;position:fixed;inset:0;background:#0a0e14;z-index:55;flex-direction:column}
#ahead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
       padding-top:calc(10px + env(safe-area-inset-top));position:relative;z-index:20}
#atitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#actrl{display:flex;align-items:center;gap:6px}
/* one overflow-menu language across chat, file, and subagent surfaces */
.ovwrap{position:relative;flex:0 0 auto}
.ovbtn{width:40px;height:36px;display:inline-flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--fg);
  font:inherit;font-size:24px;line-height:1;cursor:pointer;padding:0 0 4px}
.ovbtn:hover,.ovbtn[aria-expanded="true"]{border-color:var(--blue);color:var(--blue)}
.ovmenu{display:none;position:absolute;right:0;top:calc(100% + 7px);width:238px;
  background:#11161d;border:1px solid var(--line);border-radius:10px;padding:6px;
  box-shadow:0 18px 50px rgba(0,0,0,.62);z-index:80}
.ovmenu.open{display:block}
.ovgroup{padding:5px 6px 7px}
.ovlabel{display:block;color:var(--faint);font-size:9.5px;text-transform:uppercase;
  letter-spacing:.55px;margin:0 0 5px}
.ovseg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#0b0f14;
  border:1px solid var(--line);border-radius:8px;padding:3px}
.ovseg button,.ovitem{min-height:40px;border:0;border-radius:6px;background:transparent;
  color:var(--dim);font:inherit;font-size:12.5px;cursor:pointer}
.ovseg button[aria-pressed="true"]{background:var(--card2);color:var(--fg);font-weight:600}
.ovseg button:disabled,.ovitem:disabled{opacity:.38;cursor:not-allowed}
.ovsep{height:1px;background:var(--line);margin:4px 6px}
.ovitem{display:flex;width:100%;align-items:center;justify-content:space-between;text-align:left;
  padding:0 10px;color:var(--fg)}
.ovitem:hover:not(:disabled){background:var(--card2)}
.ovitem small{color:var(--faint);font-size:10px}
.ovitem.danger{color:var(--red)}
.ovitem.danger:hover:not(:disabled){background:#2a1517}
/* "are you sure" interstitial for any stop */
#confirm{display:none;position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.62);
  align-items:center;justify-content:center;padding:20px}
.cfbox{max-width:440px;width:100%;background:var(--card);border:1px solid var(--red);
  border-radius:12px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.cftitle{font-size:15px;font-weight:700;color:var(--red);margin-bottom:8px}
.cfbody{font-size:13px;color:var(--dim);line-height:1.5}
.cfbody b{color:var(--fg)}
.cfbtns{display:flex;gap:10px;margin-top:16px}
.cfbtns .pbtn{flex:1;padding:10px;font-size:13px}
.cfbtns .cfgo{background:#2a1517;border-color:var(--red);color:var(--red);font-weight:600}
.cfbtns .cfgo:hover{background:var(--red);color:#0a0e14}
#atitle small{color:var(--dim);font-weight:400;margin-left:8px}
#aclose{background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--fg);
        font:inherit;font-size:14px;padding:5px 12px;cursor:pointer}
#abody{flex:1;overflow:auto;padding:14px;overscroll-behavior:contain}
#aact{border-top:1px solid var(--line);background:var(--card);
      padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
#aact .dfold{margin-top:10px}
.aconvo{width:100%;max-width:none;margin-inline:auto}
.relaynote{font-size:11px;color:var(--dim);background:#12161c;border:1px solid var(--line);
  border-radius:8px;padding:6px 9px;margin-bottom:8px;line-height:1.45}
.relaynote b{color:var(--amber)}
.arow .aopen{color:var(--faint);font-size:14px;padding-left:2px}
/* session pin control (desktop; touch screens use a long press on the header) */
.shead .spin,.historymain .spin{background:var(--card);border:1px solid var(--line);border-radius:8px;
  color:var(--fg);cursor:pointer;font-size:13px;line-height:1;padding:8px 10px;
  opacity:.55;filter:grayscale(1);flex:0 0 auto}
.shead .spin:hover,.historymain .spin:hover{opacity:1;filter:none;border-color:var(--blue)}
.shead .spin.on,.historymain .spin.on{opacity:1;filter:none;border-color:rgba(88,166,255,.55)}
.card.pinned{box-shadow:0 0 0 1px rgba(88,166,255,.35);opacity:1}
/* global pinned-sessions block, directly below the usage header */
#pinned{margin-bottom:18px}
#pinned.empty{display:none}
.pinhdr{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);padding:5px 8px 4px}
#pinned .card:last-child{margin-bottom:0}
/* min-height:0 + a CAPPED bar: without the cap an open question grows #vact
   without limit and squeezes the document to a few px, leaving a scrollbar with
   nowhere to scroll (the "third scrollbar") */
#vbody{flex:1;min-height:120px;overflow:auto;padding:14px;overscroll-behavior:contain}
#vact{border-top:1px solid var(--line);background:var(--card);padding:8px 12px calc(10px + env(safe-area-inset-bottom));
      max-height:58vh;overflow-y:auto;overscroll-behavior:contain}
#vact:empty{display:none}
#vact .qtext{font-size:12px;margin:2px 0 4px;color:var(--dim);white-space:pre-wrap}
#vact .optbtn{margin:4px 0;padding:6px 9px;font-size:12px}
/* each disclosure is a CONTAINER: the header row is the tap target, and the
   conversation / question it discloses lives INSIDE it */
.togbox{background:var(--card2);border:1px solid var(--line);border-radius:9px;
  padding:2px 10px;margin:6px 0}
.togbox.waiting{border-color:var(--amber);background:#1c1810}
.togbox.waiting .vchat-toggle{color:var(--amber);font-weight:600}
.togbody{border-top:1px solid var(--line);margin:0 -10px;padding:8px 10px 6px}
.togbox.waiting .togbody{border-top-color:#3a2f16}
.togbody .pend{border:none;background:none;padding:0;margin:0}
.vchat-toggle{display:block;width:100%;text-align:left;background:none;border:none;color:var(--dim);
              font:inherit;font-size:12.5px;cursor:pointer;padding:9px 0;user-select:none}
.togrow{display:flex;align-items:center;gap:8px}
.togrow .vchat-toggle{flex:1;width:auto}
.togrow .expandbtn{float:none;flex:0 0 auto}
/* new-session launcher */
/* same gap the folds use between each other (details.foldbox margin-top) */
#newsess{margin-top:14px}
.newbtn{display:block;width:100%;background:var(--card);border:1px dashed var(--line);
  border-radius:10px;color:var(--dim);font:inherit;font-size:13px;font-weight:600;
  padding:12px;cursor:pointer;margin:0}
.newbtn:hover{border-color:var(--blue);color:var(--blue)}
.newform{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0}
.nfhead{display:flex;align-items:center;justify-content:space-between;font-weight:600;
  font-size:13px;margin-bottom:8px}
.nflab{display:block;font-size:10px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.4px;margin:8px 0 3px}
.nfsel,.nfin{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:8px;
  color:var(--fg);font:inherit;font-size:13px;padding:8px 9px;margin-bottom:4px}
.nfrow{display:flex;gap:10px}
.nfcol{flex:1;min-width:0}
.nfwarn{background:#2b2111;border:1px solid var(--amber);color:var(--amber);border-radius:8px;
  padding:7px 9px;font-size:11.5px;margin:6px 0;line-height:1.45}
.nfgo{width:100%;margin-top:10px;padding:10px}
.nfcheck{display:flex;align-items:center;gap:9px;margin:10px 0;font-size:13px;cursor:pointer}
.nfcheck input{width:24px;height:24px;flex:0 0 auto;margin:0;accent-color:var(--blue);cursor:pointer}
.nfcheck span{line-height:1}
/* the "open" button focuses an iTerm tab — meaningless from a phone */
@media (pointer:coarse),(max-width:600px){.deskonly{display:none}}
/* the card's question SIGNAL: no controls, just "you're blocked — go answer" */
.qsignal{cursor:pointer}
.qsignal .pbtn.qanswer{margin-top:8px;width:100%;background:#2b2111;border-color:var(--amber);
  color:var(--amber);font-weight:600;padding:8px 10px}
.qsignal:hover .pbtn.qanswer{background:var(--amber);color:#0a0e14}
.vconvo{max-height:34vh;border:1px solid var(--line);border-radius:8px;background:#10141b;
        padding:4px 9px;margin-top:4px}
/* light theme — shared by all full-screen reading surfaces */
#vbody.light,#sbody.light,#abody.light{background:#f7f8fa;color:#1c2128}
.light .mdoc code{background:#eff1f3;border-color:#d0d7de}
.light .mdoc pre{background:#f0f2f4;border-color:#d0d7de}
.light .mdoc pre code{background:none}
.light .mdoc blockquote{border-color:#d0d7de;color:#57606a}
.light .mdoc a{color:#0969da}
.light td,.light th{border-color:#d8dee4}
.light th{color:#57606a}
.light .mdoc hr{border-color:#d0d7de}
.light pre.raw{color:#1c2128}
/* chat bubbles in light mode (#sbody / vconvo) */
.light .cmsg .crole{color:#8a919a}
.light .cmsg .cbody{color:#1c2128}
.light .cmsg.user .cbody{background:#eaf1fb;border-color:#c5d9f2}
.light .cmsg.assistant .cbody{background:#fff;border-color:#d0d7de}
.light .ctool .tline{color:#57606a}
.light .ctool .tline b{color:#1c2128}
.light .ctool .tdot{color:#1a7f37}
.light .fcap,.light .ctxload{color:#57606a}
#vbody img{max-width:100%;height:auto;border-radius:6px}
#vbody pre.raw{white-space:pre-wrap;word-break:break-word;font-size:12px}
.mdoc{font-size:13.5px;line-height:1.55;width:100%;max-width:none;margin-inline:auto}
.mdoc h1{font-size:19px;margin:14px 0 6px}
.mdoc h2{font-size:16px;margin:14px 0 6px}
.mdoc h3,.mdoc h4,.mdoc h5,.mdoc h6{font-size:14px;margin:12px 0 4px}
.mdoc p{margin:6px 0}

<script>
const $=q=>document.querySelector(q);
(()=>{const m=location.search.match(/[?&]token=([0-9a-f]+)/);
  if(m){document.cookie=`act_token=${m[1]};path=/;max-age=31536000;SameSite=Lax`;
        history.replaceState(null,'',location.pathname);}})();
const open=new Set();
const expandedPeeks=new Set();
const infoOpen=new Set(),doneOpen=new Set(),filesOpen=new Set();  // detail-panel fold state, survives re-renders
// input guard, two windows: a scroll gesture (touchmove OR desktop wheel/trackpad)
// holds POLL re-renders 1500ms so the scrollbox isn't replaced mid-gesture (a
// replaced node kills wheel momentum: "scroll stops after a second"); a tap
// (touchstart) holds them 800ms so the 2s tick can't detach a button between
// touch and its click event (detached node = swallowed click). User-action
// renders pass force=true and bypass the guard — tap feedback must paint
// immediately.
let lastMove=0,lastTap=0;
document.addEventListener('touchstart',()=>{lastTap=Date.now()},{passive:true});
document.addEventListener('touchmove',()=>{lastMove=Date.now()},{passive:true});
document.addEventListener('wheel',()=>{lastMove=Date.now()},{passive:true});
const touching=()=>Date.now()-lastMove<1500||Date.now()-lastTap<800;
// scrollbar auto-hide: thumbs are transparent until the element actually scrolls
// (class fades 700ms after the last scroll event). Deliberately NOT tied into
// lastMove — programmatic scrolls (sticky-bottom restores) fire scroll events
// too, and feeding those into the render guard would starve re-renders.
let sbFade;
let fstripScroll=0;   // shared so the file strip keeps its position across the md
                      // viewer ↔ full chat view switch (a fresh DOM element each side)
document.addEventListener('scroll',e=>{
  const el=e.target===document?document.documentElement:e.target;
  if(el.classList){
    el.classList.add('scrolling');
    if(el.classList.contains('fstrip'))fstripScroll=el.scrollLeft;   // remember it live
  }
  clearTimeout(sbFade);
  sbFade=setTimeout(()=>document.querySelectorAll('.scrolling').forEach(x=>x.classList.remove('scrolling')),700);
},{passive:true,capture:true});
const fmt$=v=>v==null?'unavailable':'$'+(v>=100?v.toFixed(0):v>=10?v.toFixed(1):v.toFixed(2));
const fmtTok=v=>v==null?'—':v>=1e9?(v/1e9).toFixed(2)+'B':v>=1e6?(v/1e6).toFixed(2)+'M':v>=1e3?(v/1e3).toFixed(0)+'k':v;
const fmtAge=s=>s>=86400?Math.round(s/86400)+'d':s>=3600?Math.round(s/3600)+'h':s>=60?Math.round(s/60)+'m':s+'s';
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stateLabel={running:'Working',needs_you:'Response needed',turn_done:'Available',idle:'Available',
  stalled:'Slow',stalled_or_prompt:'Check session',dormant:'Inactive',reopenable:'Reopenable',
  stale:'Unavailable',error:'Fix needed'};

// ---- provider plan-usage header (currently Claude supplies these account gauges) ----
function usageReset(iso){
  if(!iso)return'';
  const t=Date.parse(iso);if(isNaN(t))return'';
  const secs=Math.round((t-Date.now())/1000);
  const near=secs<86400;
  const when=new Date(t).toLocaleString([],near?{hour:'numeric',minute:'2-digit'}
    :{weekday:'short',hour:'numeric',minute:'2-digit'});
  return secs>0?`resets ${when} · ${fmtAge(secs)} left`:`resets ${when}`;
}
function ugauge(label,pct,reset){
  if(pct==null)return'';
  const col=pct>=90?'var(--red)':pct>=70?'var(--amber)':'var(--green)';
  return`<div class="ugauge"><span class="ulabel">${esc(String(label||''))}</span>
    <span class="ubar"><i style="width:${Math.min(pct,100)}%;background:${col}"></i></span>
    <span class="upct">${pct}%</span>
    ${reset?`<span class="ureset">${reset}</span>`:''}</div>`;
}
function usageBar(legacy,providers){
  const el=$('#usage');
  const claude=(providers&&providers.claude)||legacy;
  const codex=providers&&providers.codex;
  // Spark has a separate preview-model allowance. Keep it in the provider/API
  // data, but omit the unused model-specific bucket from the account summary.
  const codexBuckets=(codex?.buckets||[]).filter(b=>
    !/^gpt-5\.3-codex-spark\b/i.test(String(b.label||'')));
  const claudeProfiles=claude?.profiles?.length?claude.profiles:[claude];
  const claudeHtml=claude&&claudeProfiles.some(p=>p&&(p.five_hour_pct!=null||p.weekly_pct!=null||p.email))||claude?.lifetime_tokens!=null
    ?`<div class="uprovider">${claudeProfiles.filter(Boolean).map((profile,index)=>`<div class="uaccount">
      <div class="uhead"><span class="uname">Claude Code</span>
        ${profile.email?`<span class="useg"><i class="usep" aria-hidden="true">·</i><span class="uemail">${esc(profile.email)}</span></span>`:''}
        ${claude.show_active!==false&&profile.active?`<span class="useg"><i class="usep" aria-hidden="true">·</i><span class="uactive">active</span></span>`:''}
        ${index===0&&claude.lifetime_tokens!=null?`<span class="useg" title="All local Claude transcripts on this Mac across profiles, including saved subagents; excludes deleted history, claude.ai, and other computers"><i class="usep" aria-hidden="true">·</i><span class="umeta">${fmtTok(claude.lifetime_tokens)} local lifetime tokens</span></span>`:''}</div>
      ${ugauge('5-hour',profile.five_hour_pct,usageReset(profile.five_hour_reset))}
      ${claude.show_week===false?'':ugauge('weekly',profile.weekly_pct,usageReset(profile.weekly_reset))}</div>`).join('')}</div>`:'';
  const codexHtml=codex&&(codexBuckets.length||codex.email||codex.plan_type||codex.lifetime_tokens!=null||codex.reset_credits||codex.error)?`<div class="uprovider">
    <div class="uhead"><span class="uname">Codex CLI</span>
      ${codex.email?`<span class="useg"><i class="usep" aria-hidden="true">·</i><span class="uemail">${esc(codex.email)}</span></span>`:''}
      ${codex.plan_type?`<span class="useg"><i class="usep" aria-hidden="true">·</i><span class="umeta">${esc(codex.plan_type.replaceAll('_',' '))}</span></span>`:''}
      ${codex.lifetime_tokens!=null?`<span class="useg"><i class="usep" aria-hidden="true">·</i><span class="umeta">${fmtTok(codex.lifetime_tokens)} lifetime tokens</span></span>`:''}
      ${codex.reset_credits?`<span class="useg"><i class="usep" aria-hidden="true">·</i><span class="umeta">${codex.reset_credits} reset credit</span></span>`:''}</div>
    ${codex.error?`<span class="umeta">${codex.stale?'stale — ':''}${esc(codex.error)}</span>`:''}
    ${codexBuckets.map(b=>ugauge(b.label,b.used_pct,usageReset(b.reset))).join('')}</div>`:'';
  if(!claudeHtml&&!codexHtml){el.className='empty';el.innerHTML='';return;}
  el.className='';
  el.innerHTML=claudeHtml+codexHtml;
}

function spark(pts,w=64,h=16){
  if(!pts||pts.length<2)return'';
  const min=Math.min(...pts),max=Math.max(...pts),r=max-min||1;
  const p=pts.map((v,i)=>`${(i/(pts.length-1)*w).toFixed(1)},${(h-2-(v-min)/r*(h-4)).toFixed(1)}`).join(' ');
  return`<svg class="spark" width="${w}" height="${h}"><polyline points="${p}" fill="none" stroke="#58a6ff" stroke-width="1.5"/></svg>`;
}

// ---- tiny markdown renderer (self-contained: no CDN on the tailnet path) ----
function mdInline(s){
  return esc(s).split(/(`[^`]*`)/).map(p=>{
    if(p.length>1&&p.startsWith('`')&&p.endsWith('`'))return'<code>'+p.slice(1,-1)+'</code>';
    return p
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
      .replace(/\*([^*\n]+)\*/g,'<i>$1</i>');
  }).join('');
}
function md(src){
  const lines=(src||'').replace(/\r/g,'').split('\n');
  let html='',i=0,m;
  const isList=l=>/^\s*([-*+]|\d+\.)\s+/.test(l);
  const cells=r=>r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
  const isTableSep=l=>/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(l)&&l.includes('-');
  while(i<lines.length){
    const l=lines[i];
    if(/^\s*```/.test(l)){
      const buf=[];i++;
      while(i<lines.length&&!/^\s*```/.test(lines[i]))buf.push(lines[i++]);
      i++;html+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>';continue;
    }
    if(!l.trim()){i++;continue;}
    if(m=l.match(/^(#{1,6})\s+(.*)/)){const n=m[1].length;html+=`<h${n}>${mdInline(m[2])}</h${n}>`;i++;continue;}
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){html+='<hr>';i++;continue;}
    if(/^\s*>/.test(l)){
      const buf=[];while(i<lines.length&&/^\s*>/.test(lines[i]))buf.push(lines[i++].replace(/^\s*>\s?/,''));
      html+='<blockquote>'+md(buf.join('\n'))+'</blockquote>';continue;
    }
    if(isList(l)){
      const ord=/^\s*\d+\./.test(l),items=[];
      while(i<lines.length&&isList(lines[i])){
        let it=lines[i].replace(/^\s*([-*+]|\d+\.)\s+/,'');i++;
        while(i<lines.length&&/^\s{2,}\S/.test(lines[i])&&!isList(lines[i]))it+=' '+lines[i++].trim();
        items.push(it);
      }
      html+=(ord?'<ol>':'<ul>')+items.map(x=>'<li>'+mdInline(x)+'</li>').join('')+(ord?'</ol>':'</ul>');continue;
    }
    if(l.includes('|')&&i+1<lines.length&&isTableSep(lines[i+1])){
      const head=cells(l);i+=2;let rows='';
      while(i<lines.length&&lines[i].includes('|')&&lines[i].trim())
        rows+='<tr>'+cells(lines[i++]).map(c=>'<td>'+mdInline(c)+'</td>').join('')+'</tr>';
      html+='<table><tr>'+head.map(c=>'<th>'+mdInline(c)+'</th>').join('')+'</tr>'+rows+'</table>';continue;
    }
    const buf=[l];i++;
    while(i<lines.length&&lines[i].trim()&&!/^\s*(#{1,6}\s|```|>)/.test(lines[i])
          &&!isList(lines[i])&&!(lines[i].includes('|')&&i+1<lines.length&&isTableSep(lines[i+1])))
      buf.push(lines[i++]);
    html+='<p>'+buf.map(mdInline).join('<br>')+'</p>';
  }
  return html;
}

// Compact Markdown for card peeks. Preserve headings/emphasis/lists while
// collapsing document-scale code and tables into short, safe prose.
function peekMd(src){
  const withoutCode=String(src||'').replace(/```[^\n]*\n[\s\S]*?(?:```|$)/g,'`code block`');
  const lines=withoutCode.replace(/\r/g,'').split('\n'),out=[];
  const tableSep=l=>/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(l)&&l.includes('-');
  for(let i=0;i<lines.length;i++){
    if(lines[i].includes('|')&&i+1<lines.length&&tableSep(lines[i+1])){
      out.push(lines[i].replace(/^\s*\||\|\s*$/g,'').split('|').map(x=>x.trim()).join(' · '));
      i+=2;
      while(i<lines.length&&lines[i].includes('|')&&lines[i].trim())i++;
      i--;
    }else out.push(lines[i]);
  }
  return md(out.join('\n'));
}

// ---- conversation context + delivered files (fetched per session on demand) ----
const ctxCache={};   // sid -> {v, messages, files} | {fetching:true}
const ctxVersion=s=>(s.convo_v||'')+':'+(s.files_n||0);
async function ensureCtx(sid,v){
  const c=ctxCache[sid];
  if(c&&(c.v===v||c.fetching))return;
  ctxCache[sid]={...(c||{}),fetching:true};
  try{
    const r=await fetch('/api/context?sid='+encodeURIComponent(sid),{cache:'no-store'});
    const d=await r.json();
    ctxCache[sid]=d.ok?{v,messages:d.messages||[],files:d.files||[]}:{v,messages:[],files:[]};
    render(last);
  }catch(e){delete ctxCache[sid];}
}
// "opus · high". Effort comes from the statusline side-write, so a session whose
// statusline hasn't rendered yet (or isn't installed) shows the model alone.
const modelLabel=s=>esc(s.model||s.family||'?')+(s.effort?` · ${esc(s.effort)}`:'');
function modeSelect(s,pre='msg'){
  if(!s||s.provider!=='codex')return'';
  const mode=s.collaboration_mode||'default';
  const locked=!s.capabilities?.submit||['running','needs_you','stalled'].includes(s.state);
  return`<select class="modesel" title="Codex collaboration mode — Plan enables structured questions; Default executes work"
    onclick="event.stopPropagation()" onchange="setSessionMode('${s.session_id}',this.value,'${pre}')" ${locked?'disabled':''}>
    <option value="plan" ${mode==='plan'?'selected':''}>Plan</option>
    <option value="default" ${mode==='default'?'selected':''}>Default</option></select>`;
}
const enc=v=>encodeURIComponent(v||'').replace(/'/g,'%27');  // onclick-attr-safe
const cpb=v=>`<b class="copyable" title="tap to copy" data-copy="${esc(v)}" onclick="copyTxt(event,this)">${esc(v)}</b>`;
function fchip(sid,f,cap){
  return`<button class="fchip" ${f.missing?'disabled':''} title="${esc(cap||f.path)}"
    onclick="event.stopPropagation();viewFile('${sid}','${enc(f.path)}','${enc(f.name)}','${f.kind}','${enc(cap)}')">${f.kind==='image'?'🖼':'📄'} ${esc(f.name)}${f.missing?' (gone)':''}</button>`;
}
const EVT_ICON={compact:'⧉',model:'⇄',api_error:'⚠',command:'›',qa:'☑'};
function eventRow(m,provider='claude'){
  if(m.kind==='qa'){
    const rows=(m.qa||[]).map(q=>`<div class="qarow">
      <div class="qaq">${q.header?`<span class="qah">${esc(q.header)}</span>`:''}${esc(q.q)}</div>
      <div class="qaa">${esc(q.a||'—')}</div></div>`).join('');
    return`<div class="cevt info"><div class="evline"><span class="evi">☑</span> <b>You answered ${esc(provider)}'s questions</b></div>
      <div class="qawrap">${rows}</div></div>`;
  }
  return`<div class="cevt ${m.level||'info'}">
    <div class="evline"><span class="evi">${EVT_ICON[m.kind]||'•'}</span> <b>${esc(m.title)}</b>${m.n>1?`<span class="evn">×${m.n}</span>`:''}</div>
    ${m.detail?`<div class="evd">${esc(m.detail)}</div>`:''}</div>`;
}
const optimisticMessages=new Map();
let optimisticSequence=0;
const quickResponses=new Map();
const normalizedMessage=text=>String(text||'').trim().replace(/\s+/g,' ');
function optimisticList(sid){
  if(!optimisticMessages.has(sid))optimisticMessages.set(sid,[]);
  return optimisticMessages.get(sid);
}
function canonicalCount(messages,item){
  if(item.kind==='answer')return(messages||[]).filter(message=>
    message.role==='event'&&message.kind==='qa').length;
  const wanted=normalizedMessage(item.text);
  return(messages||[]).filter(message=>message.role==='user'&&
    normalizedMessage(message.text)===wanted).length;
}
function addOptimistic(sid,text,kind='text'){
  const messages=(ctxCache[sid]&&ctxCache[sid].messages)||[];
  const item={id:++optimisticSequence,sid,text:String(text||''),kind,status:'sending',
    baseCount:canonicalCount(messages,{kind,text}),created:Date.now()};
  optimisticList(sid).push(item);
  setTimeout(()=>{
    const current=optimisticList(sid).find(entry=>entry.id===item.id);
    if(current&&current.status==='sending'){
      current.status='failed';current.error='Not confirmed after 15 seconds';uiRefresh();
    }
  },15000);
  uiRefresh();
  return item.id;
}
function updateOptimistic(sid,id,ok,error,providerConfirmed=false){
  const item=optimisticList(sid).find(entry=>entry.id===id);
  if(!item)return;
  if(!ok){item.status='failed';item.error=error||'Send failed';}
  else if(providerConfirmed)item.status='confirmed';
  uiRefresh();
}
function visibleOptimistic(sid,messages){
  const list=optimisticList(sid);
  const keep=list.filter(item=>{
    if(canonicalCount(messages,item)>item.baseCount)return false;
    return true;
  });
  if(keep.length!==list.length)optimisticMessages.set(sid,keep);
  return keep;
}
function restoreOptimistic(sid,id){
  const list=optimisticList(sid),item=list.find(entry=>entry.id===id);
  optimisticMessages.set(sid,list.filter(entry=>entry.id!==id));
  if(item?.kind==='answer'){delete answered[sid];uiRefresh();return;}
  uiRefresh();
  requestAnimationFrame(()=>{
    const input=document.getElementById('sft-'+sid)||document.getElementById('vft-'+sid)||
      document.getElementById('ft-'+sid);
    if(input){input.value=item?.text||'';input.focus();}
  });
}
function optimisticHtml(sid,messages){
  return visibleOptimistic(sid,messages).map(item=>`<div class="cmsg user optimistic" data-optimistic-id="${item.id}">
    <span class="crole">you</span>${item.status==='sending'?`<span class="delivery sending" aria-label="sending">◌</span>`:
      item.status==='failed'?`<button class="delivery failed" title="${esc(item.error||'Send failed')} — restore" aria-label="send failed; restore message" onclick="restoreOptimistic('${sid}',${item.id})">!</button>`:''}
    <div class="cbody"><p>${esc(item.text).replace(/\n/g,'<br>')}</p></div></div>`).join('');
}
function quickResponseLabel(payload){
  if(payload.type==='permission')return `${payload.choice==='always'?'Always allow':
    payload.choice==='allow'?'Allow':payload.choice==='deny'?'Deny':'Cancel'} permission`;
  if(payload.type==='dismiss')return'Dismiss question';
  if(payload.type==='elicitation')return payload.choice==='accept'?'Submit form':
    payload.choice==='decline'?'Decline form':'Cancel form';
  return'Submit response';
}
function beginQuickResponse(sid,payload){
  const item={id:++optimisticSequence,sid,nonce:payload.nonce,text:quickResponseLabel(payload),
    status:'sending',created:Date.now()};
  quickResponses.set(sid,item);uiRefresh();return item.id;
}
function finishQuickResponse(sid,id,ok,error){
  const item=quickResponses.get(sid);
  if(!item||item.id!==id)return;
  item.status=ok?'sent':'failed';item.error=error||'';uiRefresh();
}
function reconcileQuickResponses(f){
  const sessions=new Map(((f&&f.sessions)||[]).map(s=>[s.session_id,s]));
  for(const [sid,item] of quickResponses){
    const session=sessions.get(sid);
    if(!session||(item.status!=='sending'&&item.nonce&&session.pending?.nonce!==item.nonce))
      quickResponses.delete(sid);
  }
}
function cardResponseFeedback(s){
  const messages=((ctxCache[s.session_id]||{}).messages)||[];
  const answers=visibleOptimistic(s.session_id,messages).filter(item=>item.kind==='answer');
  const answer=answers.length?answers[answers.length-1]:null;
  const action=quickResponses.get(s.session_id)||null;
  const item=!answer?action:!action?answer:(answer.created>=action.created?answer:action);
  if(!item)return'';
  const status=item.status==='confirmed'||item.status==='sent'?'sent':item.status;
  const verb=status==='sending'?'Submitting':status==='failed'?'Failed':'Submitted';
  const icon=status==='sending'?`<span class="delivery sending" aria-label="sending quick response">◌</span>`:
    status==='failed'?(item.kind==='answer'
      ?`<button class="delivery failed" title="${esc(item.error||'Submission failed')} — restore" aria-label="submission failed; restore response" onclick="event.stopPropagation();restoreOptimistic('${s.session_id}',${item.id})">!</button>`
      :`<span class="delivery failed" title="${esc(item.error||'Submission failed')}" aria-label="submission failed">!</span>`)
      :`<span class="delivery sent" aria-label="response submitted">✓</span>`;

// Reconcile #sessions in place: persist each card node, rebuild only the volatile
// top every poll, and rebuild the tail only when detailSig changes. This keeps an
// expanded card's open <details> from remounting (and flashing) every tick.
function reconcileCards(container,list,emptyMessage='no live sessions'){
  if(!list.length){container.innerHTML=emptyMessage?`<div class="empty">${esc(emptyMessage)}</div>`:'';return;}
  if(container.querySelector('.empty'))container.innerHTML='';
  const seen=new Set();
  list.forEach(s=>{
    seen.add(s.session_id);
    const isOpen=open.has(s.session_id);
    let card=container.querySelector('.card[data-sid="'+s.session_id+'"]');
    if(!card){
      card=document.createElement('div');card.dataset.sid=s.session_id;
      const top=document.createElement('div');top.className='ctop';card.appendChild(top);
      container.appendChild(card);
    }
    card.className='card'+(cardCls(s)?' '+cardCls(s):'')+(isOpen?' open':'')+(pinnedSessions.has(s.session_id)?' pinned':'');
    card.querySelector('.ctop').innerHTML=cardTop(s);
    let detail=card.querySelector(':scope > .detail');
    if(isOpen){
      const sig=detailSig(s);
      if(!detail||card.dataset.dsig!==sig){
        if(detail)detail.remove();
        card.insertAdjacentHTML('beforeend',cardDetail(s));
        card.dataset.dsig=sig;
      }
    }else if(detail){detail.remove();delete card.dataset.dsig;}
  });
  [...container.children].forEach(el=>{if(el.classList.contains('card')&&!seen.has(el.dataset.sid))el.remove();});
  list.forEach((s,i)=>{
    const el=container.querySelector('.card[data-sid="'+s.session_id+'"]');
    if(el&&container.children[i]!==el)container.insertBefore(el,container.children[i]||null);
  });
}

// multi-question asks: ONE question on screen at a time, ‹ › to move between them

function mqBlock(s,p,pre){
  const sid=s.session_id;
  let st=mqSel[sid];
  if(!st||st.nonce!==p.nonce)st=mqSel[sid]={nonce:p.nonce,qi:0,a:{},other:{}};
  const qs=p.questions;
  if(st.qi>=qs.length)st.qi=qs.length-1;
  const qi=st.qi,q=qs[qi],ms=!!q.multiSelect;
  const sel=st.a[qi]||new Set();
  const ansd=i=>((st.a[i]&&st.a[i].size)||(st.other[i]||'').trim())?1:0;
  const donecnt=qs.reduce((a,_,i)=>a+ansd(i),0);
  const oth=(st.other[qi]||'').trim();
  const picked=[...sel].sort().map(d=>(q.options[d-1]||{}).label)
    .concat(oth?['“'+oth+'”']:[]).join(', ');
  return`<div class="ptool"><span class="ptlabel">multi-part question (${qs.length}) — waiting on you</span>
      <button class="xbtn" title="${p.dismiss_action==='cancel_turn'?'dismiss by stopping this Codex turn':'dismiss — chat about this instead'}" onclick="sendDismiss('${sid}','${p.nonce}','${pre}')">✕</button></div>
    ${p.files&&p.files.length?`<div class="pfiles"><span class="plabel">read first</span>${p.files.map(f=>fchip(sid,f,f.caption)).join('')}</div>`:''}
    <div class="mqnav"><button class="mqarr" ${qi===0?'disabled':''} onclick="mqNav('${sid}',-1)">‹</button>
      <span class="mqpos"><b>${qi+1}</b> of ${qs.length} · ${donecnt}/${qs.length} answered</span>
      <button class="mqarr" ${qi===qs.length-1?'disabled':''} onclick="mqNav('${sid}',1)">›</button></div>
    <div class="qtext"><b>${esc(q.header||'')}</b> ${esc(q.question)}${ms?' <small>(pick all that apply)</small>':''}</div>
    ${(q.options||[]).map((o,i)=>`<button class="optbtn ${sel.has(i+1)?'sel':''}"
        onclick="mqToggle('${sid}',${qi},${i+1},${ms},${qs.length})">${esc(o.label)}${o.description?`<small>${esc(o.description)}</small>`:''}</button>`).join('')}
    ${q.allowOther!==false?`<div class="freetext"><input placeholder="Other — type your own answer" ${q.secret?'type="password"':''} value="${esc(st.other[qi]||'')}"
      oninput="mqOther('${sid}',${qi},this.value)"></div>`:''}
    <div class="mqsum">selected: ${picked?esc(picked):'—'}</div>
    <div class="pbtns"><button class="pbtn send" onclick="mqSend('${sid}','${p.nonce}','${pre}')">submit all answers</button></div>`;
}
function mqToggle(sid,qi,d,multi,total){
  const st=mqSel[sid];if(!st)return;
  const sel=st.a[qi]||(st.a[qi]=new Set());
  if(multi){sel.has(d)?sel.delete(d):sel.add(d);}
  else{st.a[qi]=new Set([d]);st.other[qi]='';
       if(st.qi<total-1)st.qi++;}      // picked → advance, like the TUI
  uiRefresh();
}
function mqNav(sid,d){const st=mqSel[sid];if(!st)return;st.qi=Math.max(0,st.qi+d);uiRefresh();}
function mqOther(sid,qi,v){const st=mqSel[sid];if(st)st.other[qi]=v;}
function mqSend(sid,nonce,pre){
  const s=((last||{}).sessions||[]).find(x=>x.session_id===sid);
  const p=s&&s.pending;const st=mqSel[sid];
  if(!p||!st||st.nonce!==nonce)return alert('the prompt changed — refresh');
  const answers=[];
  for(let qi=0;qi<p.questions.length;qi++){
    const digits=[...(st.a[qi]||[])].sort();
    const other=(st.other[qi]||'').trim();
    if(!digits.length&&!other){st.qi=qi;uiRefresh();return alert('answer question '+(qi+1)+' first');}
    const a={multi:!!p.questions[qi].multiSelect,n_options:(p.questions[qi].options||[]).length};
    if(a.multi){if(digits.length)a.digits=digits;if(other)a.other=other;}
    else if(other)a.other=other;
    else a.digits=digits;
    answers.push(a);
  }
  const optimisticId=addOptimistic(sid,answerPreview(sid,answers),'answer');
  act(sid,{type:'multiq',nonce,answers},pre,optimisticId);
}
function elicitationBlock(s,p,pre){
  const sid=s.session_id;

      ${(f.options||[]).map(o=>`<button class="optbtn ${(value||[]).some(v=>String(v)===String(o.value))?'sel':''}"
        onclick="elicitSet('${sid}','${key}','${enc(JSON.stringify(o.value))}',true)">${esc(o.label)}</button>`).join('')}`;
    if(f.type==='select')return`<label class="qtext"><b>${esc(f.label)}</b>${f.required?' *':''}
      <select onchange="elicitValue('${sid}','${key}',this.value)"><option value="">choose…</option>
      ${(f.options||[]).map(o=>`<option value="${enc(JSON.stringify(o.value))}" ${String(value)===String(o.value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select></label>`;
    if(f.type==='boolean')return`<label class="setrow"><input type="checkbox" ${value?'checked':''}
      onchange="elicitBool('${sid}','${key}',this.checked)">${esc(f.label)}</label>`;
    return`<label class="qtext"><b>${esc(f.label)}</b>${f.required?' *':''}<input ${f.secret?'type="password"':''}

  const safeUrl=String(p.url||'').startsWith('https://')||String(p.url||'').startsWith('http://');

    <div class="qtext">${esc(p.message||'')}</div>${fields}
    ${safeUrl?`<a class="jump" href="${esc(p.url)}" target="_blank" rel="noopener">open request ↗</a>`:''}
    <div class="pbtns">
      <button class="pbtn allow" onclick="sendElicitation('${sid}','${p.nonce}','accept','${pre}')">accept</button>
      <button class="pbtn deny" onclick="sendElicitation('${sid}','${p.nonce}','decline','${pre}')">decline</button>
      <button class="pbtn" onclick="sendElicitation('${sid}','${p.nonce}','cancel','${pre}')">cancel</button>
    </div><div class="actmsg" id="${pre}-${sid}"></div></div>`;
}
function elicitText(sid,key,value){(elicitDraft[sid]||(elicitDraft[sid]={}))[decodeURIComponent(key)]=value;}
function elicitBool(sid,key,value){(elicitDraft[sid]||(elicitDraft[sid]={}))[decodeURIComponent(key)]=value;}
function elicitValue(sid,key,value){
  const name=decodeURIComponent(key);if(!value)delete (elicitDraft[sid]||{})[name];
  else (elicitDraft[sid]||(elicitDraft[sid]={}))[name]=JSON.parse(decodeURIComponent(value));
}
function elicitSet(sid,key,encoded,toggle){
  const name=decodeURIComponent(key),value=JSON.parse(decodeURIComponent(encoded));
  const draft=elicitDraft[sid]||(elicitDraft[sid]={}),values=Array.isArray(draft[name])?draft[name]:[];
  const at=values.findIndex(v=>String(v)===String(value));if(at>=0)values.splice(at,1);else values.push(value);
  draft[name]=values;uiRefresh();
}
function sendElicitation(sid,nonce,choice,pre){
  const s=((last||{}).sessions||[]).find(x=>x.session_id===sid),p=s&&s.pending;
  if(!p||p.nonce!==nonce)return alert('the request changed — refresh');
  const content={...(elicitDraft[sid]||{})};
  if(choice==='accept')for(const f of p.fields||[]){
    if(f.required&&(content[f.name]==null||content[f.name]===''||(Array.isArray(content[f.name])&&!content[f.name].length)))
      return alert(`${f.label||f.name} is required`);
  }
  act(sid,{type:'elicitation',nonce,choice,content:choice==='accept'?content:undefined},pre);
}

async function setSessionMode(sid,mode,pre='msg'){
  const s=((last&&last.sessions)||[]).find(x=>x.session_id===sid);
  if(!s||s.provider!=='codex')return;

  s.collaboration_mode=mode;uiRefresh();
  try{
    const r=await fetch('/api/act',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session_id:sid,type:'mode',mode})});
    const d=await r.json();
    if(!d.ok){s.collaboration_mode=previous;uiRefresh();alert(d.error||'mode change failed');return;}
    s.collaboration_mode=d.mode||mode;uiRefresh();
  }catch(e){s.collaboration_mode=previous;uiRefresh();alert('mode change failed: '+e);}

async function act(sid,payload,pre='msg',optimisticId=null){
  const isQuick=['permission','dismiss','elicitation'].includes(payload.type);
  const quickId=isQuick?beginQuickResponse(sid,payload):null;
  const setMessage=text=>{const el=document.getElementById(pre+'-'+sid);
    if(el)el.textContent=text;return el;};
  if(payload.type!=='ping')setMessage('sending…');
  try{
    const r=await fetch('/api/act',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session_id:sid,...payload})});
    const d=await r.json();
    if(optimisticId!=null)updateOptimistic(sid,optimisticId,d.ok,d.error,
      d.ok&&['option','multiq'].includes(payload.type));
    if(quickId!=null)finishQuickResponse(sid,quickId,d.ok,d.error);
    const el=setMessage(d.ok?'sent ✓':'✗ '+(d.error||'failed'));
    if(!d.ok&&!el&&quickId==null)alert(d.error||'failed');
    if(d.ok&&payload.nonce&&['option','multiq','permission','dismiss','elicitation'].includes(payload.type)){
      answered[sid]=payload.nonce;      // hide the selector NOW, don't wait for the poll
      delete otherDraft[sid];delete mqSel[sid];delete elicitDraft[sid];multiSel[sid]=new Set();
      uiRefresh();
    }
    return d;
  }catch(e){
    if(optimisticId!=null)updateOptimistic(sid,optimisticId,false,String(e));
    if(quickId!=null)finishQuickResponse(sid,quickId,false,String(e));
    const el=setMessage('✗ '+e);
    if(!el&&quickId==null)alert('request failed: '+e);
    return {ok:false,error:String(e)};
  }
}

  }).join('\n');

function sendCloseSession(sid,pre='smsg'){

  const provider=s.provider==='codex'
    ?'The Codex thread will be archived.'

function sendText(sid,ftPre='ft',msgPre='msg'){
  const inp=document.getElementById(ftPre+'-'+sid);
  const v=(inp&&inp.value||'').trim();
  if(!v)return;
  const cmd=(v.startsWith('/')||v.startsWith('$'))?(cmdCache[sid]||[]).find(c=>c.name===v.split(/\s+/)[0]):null;
  if(cmd&&cmd.danger&&!confirm(`${cmd.name} destroys this session's conversation state.\n\n${cmd.desc}\n\nSend it?`))return;
  slashClose();
  if(inp)inp.value='';        // clear NOW: the round-trip is the terminal's, not yours
  if(cmd&&cmd.execution==='action')return act(sid,{type:cmd.action},msgPre);
  if(cmd&&cmd.execution==='skill')return act(sid,{type:'skill',name:cmd.name,args:v.slice(cmd.name.length).trim()},msgPre);
  const optimisticId=addOptimistic(sid,v,'text');
  act(sid,{type:'text',text:v},msgPre,optimisticId);
}
