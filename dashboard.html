<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- maximum-scale=1 only disables iOS's AUTO-zoom on input focus; pinch zoom
     still works (iOS ignores it for user gestures since iOS 10) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Fleet View</title>
<link rel="stylesheet" href="/static/fleet.css">

</head>
<body>
<h1 class="pagetitle"><span>Fleet View</span><button id="gear" title="settings"
  onclick="openSettings()">⚙</button></h1>
<header><div id="totals"></div></header>
<div id="usage"></div>
<div id="pinned"></div>
<div id="stale">server unreachable — showing last snapshot</div>
<div id="providerstate"></div>
<div id="notoken" style="display:none;background:#2b2111;color:#d29922;border-radius:6px;padding:6px 10px;font-size:12px;margin-bottom:10px">
read-only: this device has no act token — buttons won't work until you open the <code>?token=…</code> URL once</div>
<div id="needs"></div>
<div id="working"></div>
<div id="sessions"></div>
<div id="newsess"></div>
<div id="history"></div>
<div id="rollup"></div>
<div id="viewer">
  <div id="vhead"><button id="vclose" onclick="closeOverflow();dismissOverlay()">✕</button><span id="vtitle"></span><span id="vctrl"></span></div>
  <div id="vbody"></div>
  <div id="vact"></div>
</div>
<div id="confirm"></div>
<div id="aview">
  <div id="ahead"><button id="aclose" onclick="closeOverflow();dismissOverlay()">✕</button><span id="atitle"></span>
    <span id="actrl"></span></div>
  <div id="abody"></div>
  <div id="aact"></div>
</div>
<div id="sview">
  <div id="shead2"><button id="sclose" onclick="closeOverflow();dismissOverlay()">✕</button><span id="stitle2"></span>
    <span id="sctrl"></span></div>
  <div id="sbody"></div>
  <div id="sact"></div>
</div>
<div id="settingsview">
  <div id="sethead"><button id="setclose" aria-label="back to fleet" title="back to fleet"
    onclick="dismissOverlay()">←</button><span id="settitle">Settings</span></div>
  <div id="settings"></div>
</div>
<script src="/static/app.js"></script>

</body>
</html>
