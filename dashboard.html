<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fleet View</title>
<style>
:root{
  --bg:#0d1117; --card:#161b22; --card2:#1c2330; --line:#2d333b;
  --fg:#e6edf3; --dim:#8b949e; --faint:#57606a;
  --green:#3fb950; --amber:#d29922; --red:#f85149; --blue:#58a6ff; --purple:#bc8cff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Mono",Menlo,sans-serif;
     padding:12px 12px calc(24px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.pagetitle{font-size:22px;font-weight:700;padding:4px 2px 2px}
header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:2px 2px 12px}
#totals{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
#totals b{color:var(--fg);font-variant-numeric:tabular-nums}
#stale{display:none;background:var(--red);color:#fff;border-radius:6px;padding:6px 10px;font-size:12px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.card.needs{border-color:var(--amber)}
.card.stalled{border-color:var(--red)}
.shead{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;user-select:none}
.chip{font-size:11px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap}
.chip.running{background:#12261e;color:var(--green)}
.chip.needs_you{background:#2b2111;color:var(--amber)}
.chip.turn_done{background:#12261e;color:var(--green);border:1px solid var(--green)}
.chip.idle{background:var(--card2);color:var(--dim)}
.chip.stalled{background:#2d1214;color:var(--red)}
.chip.stalled_or_prompt{background:#2b2111;color:var(--amber)}
.chip.dormant{background:var(--card2);color:var(--faint)}
.card.dorm{opacity:.5}
.sname{font-weight:600;overflow:hidden;flex:1;min-width:0;line-height:1.3}
.sname .stitle,.sname small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sname small{color:var(--dim);font-weight:400}
.scost{font-variant-numeric:tabular-nums;color:var(--fg);font-weight:600;white-space:nowrap}
.smeta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:0 12px 10px;font-size:12px;color:var(--dim)}
.smeta .m{white-space:nowrap}
.ctxwrap{flex:0 0 auto;display:flex;align-items:center;gap:5px}
.ctxbar{width:120px;height:5px;background:var(--card2);border-radius:3px;overflow:hidden}
.ctxbar i{display:block;height:100%;background:var(--blue);border-radius:3px}
a.jump{color:var(--blue);text-decoration:none;font-size:12px;white-space:nowrap}
.agents{border-top:1px solid var(--line)}
.detail{border-top:1px solid var(--line);background:var(--card2);padding:10px 12px;font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;color:var(--dim);margin-bottom:8px}
.kv b{color:var(--fg);font-weight:500;word-break:break-all}
.dhead{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.4px;margin:8px 0 2px}
details.foldbox{margin-top:18px}
details.foldbox summary{cursor:pointer;color:var(--dim);font-size:13px;padding:6px 2px;user-select:none}
.crow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:12px}
.crow .cname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow small{color:var(--faint)}
.pend{border-top:1px solid var(--amber);background:#1c1810;padding:10px 12px}
.pend .ptool{color:var(--amber);font-weight:600;font-size:12px;margin-bottom:6px}
.pend .qtext{font-size:13px;margin:4px 0 8px;white-space:pre-wrap}
.pend pre{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:11px;
          max-height:180px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin-bottom:8px}
.optbtn{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
        border-radius:8px;padding:8px 10px;margin:6px 0;color:var(--fg);font:inherit;font-size:13px;cursor:pointer}
.optbtn small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
.optbtn:active{background:var(--card2)}
.optbtn.sel{border-color:var(--blue);background:#101c2c}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pbtn{border:none;border-radius:8px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.pbtn.allow{background:var(--green);color:#04170a}
.pbtn.always{background:#1d4029;color:var(--green)}
.pbtn.deny{background:#3a1518;color:var(--red)}
.pbtn.send{background:var(--blue);color:#03121f}
.freetext{display:flex;gap:8px;margin-top:10px}
.freetext input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;
                padding:8px 10px;color:var(--fg);font:inherit;font-size:13px}
.actmsg{font-size:12px;margin-top:6px;color:var(--dim)}
.arow{display:flex;align-items:center;gap:8px;padding:7px 12px;border-top:1px solid #20262e;font-size:12px}
.arow:first-child{border-top:none}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.running{background:var(--green);animation:pulse 1.2s infinite}
.dot.done{background:var(--faint)}
.dot.ended{background:var(--red);opacity:.5}
.dot.stalled{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
.atype{font-weight:600;white-space:nowrap}
.adesc{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.amodel{color:var(--purple);white-space:nowrap}
.anum{font-variant-numeric:tabular-nums;color:var(--dim);white-space:nowrap}
.acost{font-variant-numeric:tabular-nums;color:var(--fg);white-space:nowrap}
svg.spark{flex-shrink:0}
.done-row{opacity:.55}
#rollup{margin-top:22px}
#rollup h2{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{color:var(--faint);font-weight:600}
td.r,th.r{text-align:right}
.empty{color:var(--faint);padding:18px;text-align:center}
</style>
</head>
<body>
<h1 class="pagetitle">Fleet View</h1>
<header><div id="totals"></div></header>
<div id="stale">server unreachable — showing last snapshot</div>
<div id="notoken" style="display:none;background:#2b2111;color:#d29922;border-radius:6px;padding:6px 10px;font-size:12px;margin-bottom:10px">
read-only: this device has no act token — buttons won't work until you open the <code>?token=…</code> URL once</div>
<div id="sessions"></div>
<div id="closed"></div>
<div id="rollup"></div>
<script>
const $=q=>document.querySelector(q);
(()=>{const m=location.search.match(/[?&]token=([0-9a-f]+)/);
  if(m){document.cookie=`act_token=${m[1]};path=/;max-age=31536000;SameSite=Lax`;
        history.replaceState(null,'',location.pathname);}})();
const open=new Set();
const fmt$=v=>'$'+(v>=100?v.toFixed(0):v>=10?v.toFixed(1):v.toFixed(2));
const fmtTok=v=>v>=1e6?(v/1e6).toFixed(2)+'M':v>=1e3?(v/1e3).toFixed(0)+'k':v;
const fmtAge=s=>s>=86400?Math.round(s/86400)+'d':s>=3600?Math.round(s/3600)+'h':s>=60?Math.round(s/60)+'m':s+'s';
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stateLabel={running:'running',needs_you:'needs you',turn_done:'done ✓',idle:'idle',stalled:'stalled',stalled_or_prompt:'prompt?',dormant:'dormant'};

function spark(pts,w=64,h=16){
  if(!pts||pts.length<2)return'';
  const min=Math.min(...pts),max=Math.max(...pts),r=max-min||1;
  const p=pts.map((v,i)=>`${(i/(pts.length-1)*w).toFixed(1)},${(h-2-(v-min)/r*(h-4)).toFixed(1)}`).join(' ');
  return`<svg class="spark" width="${w}" height="${h}"><polyline points="${p}" fill="none" stroke="#58a6ff" stroke-width="1.5"/></svg>`;
}

function agentRow(a){
  const done=['done','ended'].includes(a.state);
  return`<div class="arow ${done?'done-row':''}" style="padding-left:${12+a.depth*16}px">
    <span class="dot ${a.state}"></span>
    <span class="atype">${esc(a.agent_type)}</span>
    <span class="adesc">${esc(a.description)}</span>
    <span class="amodel">${esc(a.family)}</span>
    ${!done&&a.tok_per_s>0?`<span class="anum">${fmtTok(Math.round(a.tok_per_s))}/s</span>`:''}
    ${!done?spark(a.spark):''}
    <span class="anum">${fmtTok(a.total_tokens)}</span>
    <span class="acost">${fmt$(a.cost)}</span>
  </div>`;
}

function sessionCard(s){
  const needs=s.state==='needs_you'||s.state==='stalled_or_prompt';
  const cls=s.state==='stalled'?'stalled':needs?'needs':s.state==='dormant'?'dorm':'';
  const isOpen=open.has(s.session_id);
  const running=s.agents.filter(a=>!['done','ended'].includes(a.state));
  const done=s.agents.filter(a=>['done','ended'].includes(a.state));
  const activeSession=!['idle','dormant'].includes(s.state);
  const detail=isOpen?`<div class="detail">
      <div class="kv">
        <span>session</span><b>${esc(s.session_id)}</b>
        <span>pid</span><b>${s.pid}</b>
        <span>cwd</span><b>${esc(s.cwd)}</b>
        <span>model</span><b>${esc(s.model||'?')}</b>
        <span>started</span><b>${s.started_ms?fmtAge(Math.round(Date.now()/1000-s.started_ms/1000))+' ago':'?'}</b>
        <span>cli status</span><b>${esc(s.reg_status||'—')}</b>
        <span>tokens in ctx</span><b>${fmtTok(s.ctx_tokens)}</b>
        <span>spend</span><b>${fmt$(s.cost)} session + ${fmt$(s.agent_cost)} agents</b>
      </div>
      ${done.length?`<div class="dhead">completed agents (${done.length})</div>`+done.map(agentRow).join(''):'<div class="dhead">no completed agents</div>'}
      <div class="freetext"><input id="ft-${s.session_id}" placeholder="send a message to this session"
        onkeydown="if(event.key==='Enter')sendText('${s.session_id}')">
        <button class="pbtn send" onclick="sendText('${s.session_id}')">send</button></div>
      <div class="actmsg" id="msg-${s.session_id}"></div>
    </div>`:'';
  return`<div class="card ${cls}" data-sid="${s.session_id}">
    <div class="shead" onclick="toggle('${s.session_id}')">
      <span class="chip ${s.state}">${stateLabel[s.state]||s.state}</span>
      <span class="sname">${s.title?`<span class="stitle">${esc(s.title)}</span><small>${esc(s.project)}${s.branch&&s.branch!=='HEAD'?` · ${esc(s.branch)}`:''}</small>`:`${esc(s.project)}${s.branch&&s.branch!=='HEAD'?` <small>· ${esc(s.branch)}</small>`:''}`}</span>
      <span class="scost">${fmt$(s.cost+s.agent_cost)}</span>
    </div>
    <div class="smeta">
      <span class="m">${esc(s.family)}</span>
      <span class="ctxwrap"><span class="ctxbar"><i style="width:${Math.min(s.ctx_pct||0,100)}%"></i></span><span>ctx ${s.ctx_pct??'?'}%</span></span>
      ${s.agents_total?`<span class="m">${s.agents_running?`<b style="color:var(--green)">${s.agents_running} agent${s.agents_running>1?'s':''} running</b> · `:''}${done.length} done · ${fmt$(s.agent_cost)} on agents</span>`:''}
      <span class="m">quiet ${fmtAge(s.quiet_s)}</span>
      ${s.bridge_url?`<a class="jump" href="${s.bridge_url}" target="_blank" onclick="event.stopPropagation()">open ↗</a>`:''}
    </div>
    ${pendingBox(s)}
    ${activeSession&&running.length?`<div class="agents">${running.map(agentRow).join('')}</div>`:''}
    ${detail}
  </div>`;
}

const multiSel={};   // sessionId -> Set of chosen digits (multiSelect questions)
function pendingBox(s){
  const p=s.pending; if(!p)return'';
  if(p.kind==='question'){
    if(!p.questions||!p.questions.length)return'';
    if(p.questions.length>1)
      return`<div class="pend"><div class="ptool">multi-part question (${p.questions.length}) — answer at the terminal or claude.ai</div>
        ${p.questions.map(q=>`<div class="qtext"><b>${esc(q.header||'')}</b> ${esc(q.question)}</div>`).join('')}</div>`;
    const q=p.questions[0];
    const ms=q.multiSelect;
    const sel=multiSel[s.session_id]=multiSel[s.session_id]||new Set();
    return`<div class="pend">
      <div class="ptool">${esc(q.header||'question')} — waiting on you</div>
      <div class="qtext">${esc(q.question)}</div>
      ${(q.options||[]).map((o,i)=>`<button class="optbtn ${ms&&sel.has(i+1)?'sel':''}"
          onclick="${ms?`toggleOpt('${s.session_id}',${i+1})`:`sendOption('${s.session_id}','${p.nonce}',[${i+1}],'${esc(o.label).replace(/'/g,'')}')`}">
          ${esc(o.label)}${o.description?`<small>${esc(o.description)}</small>`:''}</button>`).join('')}
      ${ms?`<div class="pbtns"><button class="pbtn send" onclick="sendMulti('${s.session_id}','${p.nonce}')">submit selection</button></div>`:''}
      <div class="actmsg" id="msg-${s.session_id}"></div>
    </div>`;
  }
  if(p.kind==='permission'){
    return`<div class="pend">
      <div class="ptool">permission: ${esc(p.tool)} — waiting on you</div>
      <pre>${esc(p.input_summary||'')}</pre>
      <div class="pbtns">
        <button class="pbtn allow" onclick="sendPerm('${s.session_id}','${p.nonce}','allow')">allow</button>
        <button class="pbtn always" onclick="sendPerm('${s.session_id}','${p.nonce}','always')">always allow</button>
        <button class="pbtn deny" onclick="sendPerm('${s.session_id}','${p.nonce}','deny')">deny</button>
      </div>
      <div class="actmsg" id="msg-${s.session_id}"></div>
    </div>`;
  }
  return'';
}
async function act(sid,payload){
  const el=document.getElementById('msg-'+sid);
  try{
    const r=await fetch('/api/act',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session_id:sid,...payload})});
    const d=await r.json();
    if(el)el.textContent=d.ok?'sent ✓':'✗ '+(d.error||'failed');
    if(!d.ok&&!el)alert(d.error||'failed');
  }catch(e){if(el)el.textContent='✗ '+e;}
}
function sendOption(sid,nonce,digits,label){
  act(sid,{type:'option',nonce,digits});
}
function toggleOpt(sid,d){
  const s=multiSel[sid];s.has(d)?s.delete(d):s.add(d);render(last);
}
function sendMulti(sid,nonce){
  const digits=[...(multiSel[sid]||[])].sort();
  if(!digits.length)return alert('pick at least one option');
  act(sid,{type:'option',nonce,digits,multi:true});multiSel[sid]=new Set();
}
function sendPerm(sid,nonce,choice){
  act(sid,{type:'permission',nonce,choice});
}
function sendText(sid){
  const inp=document.getElementById('ft-'+sid);
  const v=(inp&&inp.value||'').trim();
  if(!v)return;
  act(sid,{type:'text',text:v});if(inp)inp.value='';
}
let closedOpen=false;
function closedSection(list,now){
  if(!list||!list.length)return'';
  return`<details class="foldbox" ${closedOpen?'open':''} ontoggle="closedOpen=this.open">
    <summary>recently closed (${list.length})</summary>
    ${list.map(c=>`<div class="crow">
      <span class="cname">${c.title?esc(c.title)+' ':''}<small>${esc(c.project)}${c.branch&&c.branch!=='HEAD'?` · ${esc(c.branch)}`:''}</small></span>
      <span class="anum">${c.agents_total||0} agents</span>
      <span class="anum">${fmtAge(Math.max(0,Math.round(now-c.closed_at)))} ago</span>
      <span class="acost">${fmt$((c.cost||0)+(c.agent_cost||0))}</span>
      ${c.bridge_url?`<a class="jump" href="${c.bridge_url}" target="_blank">↗</a>`:''}
    </div>`).join('')}
  </details>`;
}

function toggle(sid){open.has(sid)?open.delete(sid):open.add(sid);render(last);}

let rollupOpen=false;
function rollupTable(rows){
  if(!rows||!rows.length)return'';
  const byDay={};
  rows.forEach(r=>{(byDay[r.day]=byDay[r.day]||[]).push(r)});
  const total=rows.reduce((a,r)=>a+r.cost,0);
  let h=`<details class="foldbox" ${rollupOpen?'open':''} ontoggle="rollupOpen=this.open">
    <summary>agent spend · last 7 days (${fmt$(total)})</summary>
    <table><tr><th>day</th><th>agent</th><th>model</th><th class="r">runs</th><th class="r">$</th></tr>`;
  for(const day of Object.keys(byDay)){
    const rs=byDay[day];const tot=rs.reduce((a,r)=>a+r.cost,0);
    rs.forEach((r,i)=>{h+=`<tr><td>${i?'':day}</td><td>${esc(r.agent_type)}</td><td>${esc((r.model||'').split('-').find(x=>['haiku','sonnet','opus','fable'].includes(x))||r.model)}</td><td class="r">${r.runs}</td><td class="r">${r.cost.toFixed(2)}</td></tr>`});
    h+=`<tr><td></td><td colspan="3" style="color:var(--faint)">day total</td><td class="r"><b>${tot.toFixed(2)}</b></td></tr>`;
  }
  return h+'</table></details>';
}

let last=null;
function render(f){
  if(!f||!f.sessions)return;
  const t=f.totals;
  $('#totals').innerHTML=`<span><b>${t.sessions}</b> sessions</span><span><b>${t.busy}</b> busy</span>
    <span style="color:${t.needs_me?'var(--amber)':'inherit'}"><b>${t.needs_me}</b> need you</span>
    ${t.done?`<span style="color:var(--green)"><b>${t.done}</b> done</span>`:''}
    <span><b>${t.agents_running}</b> agents running</span>
    <span>agents <b>${fmt$(t.agent_cost)}</b></span><span>sessions <b>${fmt$(t.session_cost)}</b></span>`;
  const ae=document.activeElement;
  const typing=ae&&ae.tagName==='INPUT'&&$('#sessions').contains(ae);
  if(!typing)
    $('#sessions').innerHTML=f.sessions.length?f.sessions.map(sessionCard).join(''):'<div class="empty">no live sessions</div>';
  $('#closed').innerHTML=closedSection(f.closed,f.t);
  $('#rollup').innerHTML=rollupTable(f.rollup);
  document.title=(t.needs_me?`(${t.needs_me}) `:'')+'Fleet View';
}

async function tick(){
  try{
    const r=await fetch('/api/fleet',{cache:'no-store'});
    last=await r.json();
    if(last.page_v){if(window.__pv&&window.__pv!==last.page_v)return location.reload();window.__pv=last.page_v;}
    $('#stale').style.display='none';
    render(last);
  }catch(e){$('#stale').style.display='block';}
}
tick();setInterval(tick,2000);
fetch('/api/act',{method:'POST',headers:{'Content-Type':'application/json'},body:'{"type":"ping"}'})
  .then(r=>{$('#notoken').style.display=r.status===403?'block':'none';}).catch(()=>{});
</script>
</body>
</html>
